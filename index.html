<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #10131a;
    --surface: #191e29;
    --surface-2: #222838;
    --surface-3: #2a3145;
    --border: #2b3244;
    --text: #edeef3;
    --text-muted: #9298ab;
    --text-faint: #5c6377;
    --accent: #4fb8ae;
    --accent-soft: rgba(79, 184, 174, 0.14);
    --risk-on: #5ebd8b;
    --risk-on-strong: #3fd67e;
    --risk-off: #e0665f;
    --risk-off-strong: #f0453c;
    --neutral: #e8b04b;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    line-height: 1.5;
    padding-bottom: 4rem;
  }

  a { color: var(--accent); }

  ::selection { background: var(--accent-soft); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 1.25rem 1.1rem;
  }

  @media (min-width: 900px) {
    .wrap { max-width: 1160px; padding: 1.75rem 2rem; }
  }

  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }

  @media (min-width: 900px) {
    .dashboard-grid { grid-template-columns: 340px 1fr; align-items: start; }
    .col-side { position: sticky; top: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
  }

  .tab-nav {
    display: flex;
    gap: 0.25rem;
    border-bottom: 1px solid var(--border);
    margin-top: 0.3rem;
    margin-bottom: 1.5rem;
    overflow-x: auto;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    padding: 0.7rem 1.1rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .tab-panel section { margin-bottom: 1.5rem; }
  .tab-panel section:first-child { margin-top: 0; }

  .below-grid { margin-top: 1.75rem; }

  .stale-note {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--neutral);
    margin: 0.15rem 0 0.3rem;
  }

  .health-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 0.4rem;
    vertical-align: middle;
  }
  .health-dot.ok { background: var(--risk-on-strong); }
  .health-dot.warn { background: var(--neutral); }
  .health-dot.error { background: var(--risk-off-strong); }
  .health-dot.muted { background: var(--text-faint); }

  .health-banner {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    margin-bottom: 1.25rem;
  }
  .health-banner.warn {
    color: var(--neutral);
    background: rgba(232, 176, 75, 0.08);
    border: 1px solid rgba(232, 176, 75, 0.25);
  }
  .health-banner.error {
    color: var(--risk-off-strong);
    background: rgba(240, 69, 60, 0.08);
    border: 1px solid rgba(240, 69, 60, 0.25);
  }

  .veredito-block { padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
  .veredito-block:last-child { border-bottom: none; }
  .veredito-row { display: flex; justify-content: space-between; align-items: center; }
  .veredito-decisao {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    font-weight: 700;
  }
  .veredito-decisao.compra { color: var(--risk-on-strong); background: rgba(63, 214, 126, 0.1); }
  .veredito-decisao.venda { color: var(--risk-off-strong); background: rgba(240, 69, 60, 0.1); }
  .veredito-decisao.fora { color: var(--text-faint); background: var(--surface-2); }
  .veredito-razao { font-size: 0.8rem; color: var(--text-muted); margin: 0.35rem 0 0; }

  .cenario-block { padding: 0.85rem 0; border-bottom: 1px solid var(--border); }
  .cenario-block:last-child { border-bottom: none; }
  .cenario-tipo {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    display: inline-block;
  }
  .cenario-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
  .cenario-prob { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 700; color: var(--accent); }
  .cenario-tipo.expansao { color: var(--risk-on-strong); }
  .cenario-tipo.base { color: var(--text-muted); }
  .cenario-tipo.estresse { color: var(--risk-off-strong); }
  .cenario-condicao { font-size: 0.85rem; color: var(--text); margin: 0 0 0.3rem; max-width: 720px; }
  .cenario-efeito { font-size: 0.82rem; color: var(--text-muted); margin: 0; max-width: 720px; }

  .fluxo-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
  }
  .fluxo-row:last-child { border-bottom: none; }
  .fluxo-motivo { color: var(--text-faint); font-size: 0.72rem; margin-top: 0.15rem; }
  .fluxo-status {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .fluxo-status.entrada { color: var(--risk-on-strong); background: rgba(63, 214, 126, 0.1); }
  .fluxo-status.saida { color: var(--risk-off-strong); background: rgba(240, 69, 60, 0.1); }
  .fluxo-status.neutro { color: var(--text-faint); background: var(--surface-2); }

  .driver-row { padding: 0.7rem 0; border-bottom: 1px solid var(--border); break-inside: avoid; }
  .theme-trends-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
  }
  .theme-card { background: var(--surface-2); border-radius: 8px; padding: 0.75rem 0.9rem; }
  .theme-card-title { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; margin-bottom: 0.5rem; }
  .theme-today-driver { margin-bottom: 0.3rem; }
  .driver-row:last-child { border-bottom: none; }
  .driver-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
  .driver-nome { font-weight: 600; font-size: 0.85rem; }
  .driver-tendencia { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-faint); flex-shrink: 0; }
  .driver-bar-track { width: 100%; height: 5px; background: var(--surface-2); border-radius: 3px; margin: 0.4rem 0; overflow: hidden; }
  .driver-bar-fill { height: 100%; }
  .driver-bar-fill.positivo { background: var(--risk-on-strong); }
  .driver-bar-fill.negativo { background: var(--risk-off-strong); }
  .driver-bar-fill.misto { background: var(--neutral); }
  .driver-next { font-size: 0.78rem; color: var(--text-muted); margin: 0.3rem 0 0; }

  .trace-h-block { padding: 0.45rem 0; border-bottom: 1px dashed var(--border); margin-left: 0.2rem; }
  .pred-h-detail-slot { min-height: 1.6rem; }
  .trace-h-block:last-child { border-bottom: none; }
  .trace-h-top { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  .trace-h-label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-faint); flex-shrink: 0; }
  .trace-h-detail { font-size: 0.75rem; color: var(--text-muted); }
  .trace-h-line { font-size: 0.75rem; margin-top: 0.15rem; }
  .trace-h-status {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    text-transform: uppercase;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    flex-shrink: 0;
    margin-left: auto;
  }
  .trace-h-status.ok { color: var(--risk-on-strong); background: rgba(63, 214, 126, 0.1); }
  .trace-h-status.off { color: var(--risk-off-strong); background: rgba(240, 69, 60, 0.1); }
  .trace-h-status.pending { color: var(--text-faint); background: var(--surface-2); }

  .config-group { margin-bottom: 1.25rem; }
  .config-group:last-child { margin-bottom: 0; }
  .config-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
  }
  .config-row:last-child { border-bottom: none; }
  .config-key { font-family: var(--font-mono); font-size: 0.78rem; }
  .config-desc { font-size: 0.7rem; color: var(--text-faint); margin-top: 0.1rem; }
  .config-value { font-family: var(--font-mono); font-weight: 600; font-size: 0.8rem; flex-shrink: 0; color: var(--accent); }
  .config-value.muted-value { color: var(--text-faint); font-weight: 400; }

  .horizon-tabs {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
  }
  .horizon-btn {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.3rem 0.7rem;
    border-radius: 6px;
    cursor: pointer;
  }
  .horizon-btn:hover { color: var(--text); }
  .horizon-btn.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.15rem;
  }

  header.top h1 {
    font-family: var(--font-mono);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--text);
  }

  header.top .date {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: capitalize;
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.15rem;
  }

  .updated-badge {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-faint);
  }

  .refresh-btn {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.25rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--accent); }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; }

  .day-selector {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    cursor: pointer;
  }

  /* --- DESTAQUE DO DIA --- */
  .highlight-card {
    display: flex;
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem 1.1rem;
    margin-top: 0.9rem;
    font-family: var(--font-mono);
    font-size: 0.78rem;
  }
  .highlight-card .hl-item { flex: 1; }
  .highlight-card .hl-label { color: var(--text-faint); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.2rem; }
  .highlight-card .hl-value { font-weight: 700; }

  /* --- F&G COMPONENTS --- */
  .fg-components {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem 1rem;
    margin-top: 0.85rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--border);
  }
  .fg-comp-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
  }
  .fg-comp-name { color: var(--text-muted); }
  .fg-comp-val { font-family: var(--font-mono); font-weight: 600; }

  .fg-detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    column-gap: 2rem;
  }
  .fg-detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--border);
  }
  .fg-detail-row:last-child { border-bottom: none; }
  .fg-detail-name { font-weight: 600; font-size: 0.85rem; }
  .fg-detail-desc { font-size: 0.75rem; color: var(--text-faint); margin-top: 0.15rem; }
  .fg-detail-value { font-family: var(--font-mono); font-weight: 700; font-size: 1.1rem; }
  .fg-detail-label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; }
  .fg-detail-aggregate {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 0.6rem 0.85rem;
    border-bottom: none;
  }
  .fg-detail-aggregate .fg-detail-name { font-size: 0.9rem; }
  .fg-detail-aggregate .fg-detail-value { font-size: 1.4rem; }

  section {
    margin-bottom: 1.75rem;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 0.6rem 0;
  }

  /* --- GAUGE --- */
  .gauge-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem 1rem 0.9rem;
    text-align: center;
  }
  .gauge-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
    align-items: start;
  }
  .gauge-group-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    margin: 1rem 0 0.6rem;
  }
  .gauge-group-label:first-child { margin-top: 0; }
  .gauge-card-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 140px; }
  .gauge-empty-label { font-family: var(--font-mono); font-size: 0.95rem; font-weight: 600; color: var(--text-muted); }

  .gauge-svg { width: 100%; max-width: 200px; height: auto; }

  .gauge-needle {
    transform-origin: 100px 105px;
    transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .gauge-score {
    font-family: var(--font-mono);
    font-size: 1.6rem;
    font-weight: 700;
    margin-top: -1.1rem;
  }

  .gauge-label {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-top: 0.15rem;
  }

  .gauge-sub {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.6rem;
  }

  .fg-row {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }

  .fg-row .fg-val { font-weight: 700; }

  /* --- PREDICTIONS --- */
  .pred-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--border);
  }
  .pred-row:last-child { border-bottom: none; }

  .pred-symbol {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.85rem;
    width: 96px;
    flex-shrink: 0;
    line-height: 1.25;
  }
  .pred-symbol .pred-name {
    display: block;
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 0.66rem;
    color: var(--text-faint);
    white-space: normal;
  }

  .pred-dir {
    font-family: var(--font-mono);
    font-size: 1rem;
    font-weight: 700;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .pred-dir.up { color: var(--risk-on-strong); }
  .pred-dir.down { color: var(--risk-off-strong); }
  .pred-dir.flat { color: var(--text-faint); }

  .pred-horizons-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.25rem;
    margin-top: 0.6rem;
  }
  @media (max-width: 720px) {
    .pred-horizons-grid { grid-template-columns: 1fr; }
  }

  .pred-h-col {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 0.75rem 0.9rem;
    border-left: 3px solid var(--border);
  }
  .pred-h-col.dir-up { border-left-color: var(--risk-on-strong); }
  .pred-h-col.dir-down { border-left-color: var(--risk-off-strong); }
  .pred-h-col.dir-flat { border-left-color: var(--text-faint); }
  .pred-h-col.horizon-d { background: var(--surface-3, var(--surface-2)); }

  .pred-range {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.35rem;
    line-height: 1.4;
  }

  .pred-conf {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    white-space: nowrap;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    background: var(--surface-3, rgba(255,255,255,0.05));
  }
  .pred-conf.conf-high { color: var(--accent); font-weight: 700; }
  .pred-conf.conf-mid { color: var(--text-muted); }
  .pred-conf.conf-low { color: var(--text-faint); }

  .pred-align {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    margin-left: 0.5rem;
  }
  .pred-align.aligned { color: var(--risk-on-strong); background: rgba(63, 214, 126, 0.1); }
  .pred-align.mixed { color: var(--text-faint); background: var(--surface-2); }

  .pred-change {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    padding: 0.08rem 0.35rem;
    border-radius: 4px;
    display: inline-block;
  }
  .pred-change.mantem { color: var(--text-faint); background: var(--surface-2); }
  .pred-change.virou { color: var(--neutral); background: rgba(232, 176, 75, 0.12); font-weight: 700; }
  .pred-change.reforcou { color: var(--risk-on-strong); background: rgba(63, 214, 126, 0.1); }
  .pred-change.enfraqueceu { color: var(--risk-off-strong); background: rgba(240, 69, 60, 0.1); }

  .pred-instrument-block { padding: 1.1rem 0; border-bottom: 2px solid var(--border); }
  .pred-instrument-block:last-child { border-bottom: none; }
  .pred-inst-header { margin-bottom: 0.3rem; }
  .pred-symbol-big { font-family: var(--font-mono); font-weight: 700; font-size: 1.15rem; }
  .pred-inst-header .pred-name { font-family: var(--font-sans); font-weight: 400; font-size: 0.8rem; color: var(--text-faint); margin-left: 0.6rem; }
  .pred-current { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); float: right; }
  .pred-accuracy {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text);
    background: var(--surface-2);
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
    margin-left: 0.6rem;
  }
  .pred-accuracy.low-sample { color: var(--text-faint); background: transparent; border: 1px dashed var(--border); }
  .pred-est { color: var(--text-faint); margin-left: 0.3rem; }
  .pred-h-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .pred-h-label { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-faint); }

  .trace-h-mini { display: flex; gap: 0.6rem; font-size: 0.74rem; align-items: center; flex-wrap: wrap; }
  .trace-h-mini .ok { color: var(--risk-on-strong); }
  .trace-h-mini .off { color: var(--risk-off-strong); }
  .trace-h-mini .pending { color: var(--text-muted); }

function escapeHtml(str) {
  if (str == null) return ''
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
}

function todayBRTClient() {
  const now = new Date()
  const brt = new Date(now.getTime() - 3 * 60 * 60 * 1000)
  return brt.toISOString().slice(0, 10)
}

function fmtDate(iso) {
  if (!iso) return ''
  const d = new Date(iso + 'T12:00:00Z')
  return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' })
}

function directionArrow(dir) { return dir === 'alta' ? '↑' : dir === 'baixa' ? '↓' : '→' }
function directionClass(dir) { return dir === 'alta' ? 'up' : dir === 'baixa' ? 'down' : 'flat' }
function confClass(pct) {
  const n = Number(pct)
  if (n >= 55) return 'conf-high'
  if (n >= 45) return 'conf-mid'
  return 'conf-low'
}

function gaugeAngle(score) {
  const clamped = Math.max(-100, Math.min(100, score))
  return (clamped / 100) * 90
}

// Ponto (x,y) no arco do gauge pra um score dado — mesmo centro/raio
// do desenho (100,105 · r=85), mesma fórmula de ângulo do ponteiro.
// Verificado contra os pontos fixos originais (-40/-15/15/40) antes
// de virar dinâmico, pra garantir que a matemática bate.
function gaugePoint(score) {
  const angleRad = (gaugeAngle(score) * Math.PI) / 180
  const x = 100 + 85 * Math.sin(angleRad)
  const y = 105 - 85 * Math.cos(angleRad)
  return `${x.toFixed(1)},${y.toFixed(1)}`
}

const DECISAO_LABELS = { compra: 'Viés Positivo', venda: 'Viés Negativo', fora: 'Neutro' }

function renderVeredictoBlock(v) {
  if (!v) return ''
  return `
    <div class="veredito-block" style="text-align:left;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);">
      <div class="veredito-row">
        <span class="veredito-decisao ${v.decisao}">${DECISAO_LABELS[v.decisao] || v.decisao}</span>
      </div>
      <p class="veredito-razao">${escapeHtml(v.razao)}</p>
      ${v.invalidation_note ? `<p class="veredito-razao" style="color:var(--neutral);margin-top:0.3rem">⚡ Mudaria se: ${escapeHtml(v.invalidation_note)}</p>` : ''}
    </div>
  `
}

function renderSingleGauge(marketLabel, r, veredito, ontemScore, th) {
  th = th || { forte: 40, fraco: 15, offMod: -15, offForte: -40 }
  if (!r) {
    return `
      <div class="gauge-card gauge-card-empty">
        <div class="gauge-empty-label">${marketLabel}</div>
        <p class="muted" style="margin-top:1.5rem">Acumulando histórico</p>
        ${renderVeredictoBlock(veredito)}
      </div>
    `
  }
  const scoreNum = Number(r.global_score)
  const angle = gaugeAngle(scoreNum)
  const color = REGIME_COLORS[r.label] || 'var(--text-muted)'

  // Item 1: delta vs. o dia anterior disponível — nível atual sozinho
  // diz bem menos que "subiu 11 pts" ou "caiu 17 pts".
  let deltaHtml = ''
  if (ontemScore != null) {
    const delta = scoreNum - Number(ontemScore)
    if (Math.abs(delta) >= 1) {
      const seta = delta > 0 ? '↑' : '↓'
      const cor = delta > 0 ? 'var(--risk-on-strong)' : 'var(--risk-off-strong)'
      deltaHtml = `<div style="font-size:0.72rem;color:${cor};margin-top:0.15rem" title="Era ${Number(ontemScore).toFixed(0)} no dia anterior">${seta} ${Math.abs(delta).toFixed(0)} pts vs. dia anterior</div>`
    } else {
      deltaHtml = `<div style="font-size:0.72rem;color:var(--text-faint);margin-top:0.15rem">→ estável vs. dia anterior</div>`
    }
  }

  // Item 8: score nunca deveria ser caixa-preta — os sub-scores já
  // eram calculados, só nunca apareciam na tela.
  const subScores = [
    { label: 'Ações', val: r.equity_score },
    { label: 'Crédito', val: r.credit_score },
    { label: 'Volatilidade', val: r.volatility_score },
    { label: 'Juros', val: r.rates_score },
    { label: 'Câmbio', val: r.fx_score },
  ].filter((s) => s.val != null)
  const coberturaHtml = `<div style="font-size:0.68rem;color:var(--text-faint);margin-top:0.1rem">${subScores.length}/5 sinais disponíveis</div>`
  const scoreDetailHtml =
    subScores.length > 0
      ? `
    <details class="pred-details" style="margin-top:0.5rem;text-align:left">
      <summary>composição do score</summary>
      <div style="margin-top:0.3rem">
        ${subScores
          .map(
            (s) =>
              `<div style="display:flex;justify-content:space-between;font-size:0.75rem;padding:0.15rem 0"><span class="muted">${s.label}</span><strong style="color:${Number(s.val) >= 0 ? 'var(--risk-on-strong)' : 'var(--risk-off-strong)'}">${Number(s.val) > 0 ? '+' : ''}${Number(s.val).toFixed(0)}</strong></div>`
          )
          .join('')}
      </div>
    </details>
  `
      : ''

  return `
    <div class="gauge-card">
      <svg class="gauge-svg" viewBox="0 0 200 120">
        <path d="M 15,105 A 85,85 0 0 1 ${gaugePoint(th.offForte)}" stroke="var(--risk-off-strong)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M ${gaugePoint(th.offForte)} A 85,85 0 0 1 ${gaugePoint(th.offMod)}" stroke="var(--risk-off)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M ${gaugePoint(th.offMod)} A 85,85 0 0 1 ${gaugePoint(th.fraco)}" stroke="var(--neutral)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M ${gaugePoint(th.fraco)} A 85,85 0 0 1 ${gaugePoint(th.forte)}" stroke="var(--risk-on)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M ${gaugePoint(th.forte)} A 85,85 0 0 1 185,105" stroke="var(--risk-on-strong)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <line class="gauge-needle" x1="100" y1="105" x2="100" y2="28" stroke="var(--text)" stroke-width="3" stroke-linecap="round"
          style="transform: rotate(${angle}deg)"/>
        <circle cx="100" cy="105" r="5" fill="var(--text)"/>
      </svg>
      <div class="gauge-score" style="color:${color}">${scoreNum.toFixed(0)}</div>
      <div class="gauge-label" style="color:${color}">${REGIME_LABELS[r.label]} · ${marketLabel}</div>
      ${deltaHtml}
      ${coberturaHtml}
      ${scoreDetailHtml}
      ${renderVeredictoBlock(veredito)}
    </div>

}

function renderGauge(regimes, veredictos, thresholds, regimeOntem) {
  const byMarket = {}
  for (const r of regimes || []) byMarket[r.mercado] = r
  const veredictoByMarket = {}
  for (const v of veredictos || []) veredictoByMarket[v.mercado] = v
  const ontemByMarket = {}
  for (const r of regimeOntem || []) ontemByMarket[r.mercado] = Number(r.global_score)

  // Item 9: os limites de cada faixa já existiam (configuráveis),
  // só nunca apareciam pro usuário — usa o valor real se customizado,
  // senão cai no padrão do sistema.
  const thByKey = {}
  for (const t of thresholds || []) thByKey[t.key] = Number(t.value)
  const forte = thByKey['regime_threshold_risk_on_forte'] ?? 40
  const fraco = thByKey['regime_threshold_risk_on_fraco'] ?? 15
  const offMod = thByKey['regime_threshold_risk_off_moderado'] ?? -15
  const offForte = thByKey['regime_threshold_risk_off_forte'] ?? -40
  const legendaHtml = `
    <details class="pred-details" style="margin-bottom:1rem">
      <summary>o que cada faixa de score significa</summary>
      <div style="margin-top:0.3rem;font-size:0.78rem">
        <p><span style="color:var(--risk-on-strong)">●</span> Risk-On Forte: ${forte} a 100</p>
        <p><span style="color:var(--risk-on)">●</span> Risk-On Fraco: ${fraco} a ${forte - 1}</p>
        <p><span style="color:var(--neutral)">●</span> Neutro: ${offMod + 1} a ${fraco - 1}</p>
        <p><span style="color:var(--risk-off)">●</span> Risk-Off Moderado: ${offForte + 1} a ${offMod}</p>
        <p><span style="color:var(--risk-off-strong)">●</span> Risk-Off Forte: -100 a ${offForte}</p>
      </div>
    </details>
  `

  // Item 6: mapa global compacto — leitura de 2 segundos antes de
  // entrar nos gauges individuais. Global = média dos 3 países (não
  // inclui setores, que são recorte mais específico).
  const paisesComScore = ['eua', 'brasil', 'europa'].map((m) => byMarket[m]).filter(Boolean)
  let mapaHtml = ''
  if (paisesComScore.length > 0) {
    const globalScore = paisesComScore.reduce((s, r) => s + Number(r.global_score), 0) / paisesComScore.length
    const globalLabel = globalScore >= forte ? 'risk_on_forte' : globalScore >= fraco ? 'risk_on_fraco' : globalScore > offMod ? 'neutro' : globalScore > offForte ? 'risk_off_moderado' : 'risk_off_forte'
    const globalColor = REGIME_COLORS[globalLabel]
    const scores = Number(paisesComScore.reduce((s, r) => s + Number(r.global_score), 0) / paisesComScore.length)

    // dispersão entre países — EUA em risk-on com Brasil em risk-off é
    // informação por si só, não só a média escondendo os dois.
    const paisScores = paisesComScore.map((r) => Number(r.global_score))
    const dispersao = paisScores.length > 1 ? Math.max(...paisScores) - Math.min(...paisScores) : 0
    const dispersaoLabel = dispersao >= 40 ? 'alta' : dispersao >= 15 ? 'média' : 'baixa'

    const chipsHtml = [
      ['eua', 'EUA'],
      ['brasil', 'Brasil'],
      ['europa', 'Europa'],
      ['tech', 'Tech'],
      ['semicondutores', 'Semi'],
    ]
      .map(([key, label]) => {
        const r = byMarket[key]
        if (!r) return ''
        const s = Number(r.global_score)
        const ontem = ontemByMarket[key]
        const c = REGIME_COLORS[r.label]
        let arrow = ''
        if (ontem != null) {
          const d = s - ontem
          arrow = Math.abs(d) < 1 ? ' →' : d > 0 ? ` ↑${Math.abs(d).toFixed(0)}` : ` ↓${Math.abs(d).toFixed(0)}`
        }
        return `<span style="margin-right:1rem"><span class="muted">${label}</span> <strong style="color:${c}">${s.toFixed(0)}${arrow}</strong></span>`
      })
      .join('')

    mapaHtml = `
      <div class="card" style="padding:0.8rem 1.1rem;margin-bottom:1rem">
        <div style="font-size:0.95rem"><strong style="color:${globalColor}">GLOBAL: ${REGIME_LABELS[globalLabel]} · ${scores.toFixed(0)}</strong> <span class="muted" style="font-size:0.78rem">· dispersão entre países: ${dispersaoLabel}</span></div>
        <div style="margin-top:0.5rem;font-size:0.85rem">${chipsHtml}</div>
      </div>
    `
  }

  return `
    ${mapaHtml}
    ${legendaHtml}
    <div class="gauge-group-label">Países</div>
    <div class="gauge-row">
      ${renderSingleGauge('EUA', byMarket['eua'], veredictoByMarket['eua'], ontemByMarket['eua'], { forte, fraco, offMod, offForte })}
      ${renderSingleGauge('Brasil', byMarket['brasil'], veredictoByMarket['brasil'], ontemByMarket['brasil'], { forte, fraco, offMod, offForte })}
      ${renderSingleGauge('Europa', byMarket['europa'], veredictoByMarket['europa'], ontemByMarket['europa'], { forte, fraco, offMod, offForte })}
    </div>
    <div class="gauge-group-label">Setores</div>
    <div class="gauge-row">
      ${renderSingleGauge('Tech', byMarket['tech'], null, ontemByMarket['tech'], { forte, fraco, offMod, offForte })}
      ${renderSingleGauge('Semicondutores', byMarket['semicondutores'], null, ontemByMarket['semicondutores'], { forte, fraco, offMod, offForte })}
    </div>
  `
}

function fgLabelColor(label) {
  if (!label) return 'var(--text-muted)'
  const l = label.toLowerCase()
  if (l.includes('greed')) return 'var(--risk-on-strong)'
  if (l.includes('fear')) return 'var(--risk-off-strong)'
  return 'var(--text-faint)'
}

function fmtPrice(v) {
  if (v == null) return '?'
  const abs = Math.abs(v)
  const digits = abs >= 1000 ? 0 : abs >= 1 ? 2 : 4
  return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: digits, maximumFractionDigits: digits })
}

function estimateRange(current, minPct, maxPct, direction) {
  if (current == null || minPct == null || maxPct == null) return null
  const lo = Math.min(Math.abs(minPct), Math.abs(maxPct))
  const hi = Math.max(Math.abs(minPct), Math.abs(maxPct))
  if (direction === 'baixa') return { lo: current * (1 - hi / 100), hi: current * (1 - lo / 100) }
  if (direction === 'alta') return { lo: current * (1 + lo / 100), hi: current * (1 + hi / 100) }
  return { lo: current * (1 - hi / 100), hi: current * (1 + hi / 100) }
}

function fmtShortDate(dateStr) {
  if (!dateStr) return '?'
  const d = new Date(dateStr + 'T12:00:00')
  return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`
}

const HORIZON_LETTER = { '1D': 'D', '1W': 'S', '1M': 'M' }

function renderPredictionInstrument(item, latestBySymbol, accuracyByInstrument, ontemByKey) {
  const sym = escapeHtml(item.sym)
  const name = escapeHtml(item.name || '')
  const current = latestBySymbol?.[item.sym]?.close
  const horizons = ['1D', '1W', '1M']

  const acc = accuracyByInstrument?.[item.instrumentId]
  const accBadge =
    acc && acc.total > 0
      ? `<span class="pred-accuracy ${acc.total < 20 ? 'low-sample' : ''}" title="Acerto histórico de direção, palpites de 1 dia${acc.total < 20 ? ' — amostra pequena, ainda não é estatisticamente confiável' : ''}">🎯 D ${acc.correct}/${acc.total}</span>`
      : ''

  // Item 2: alinhamento entre D/S/M — os 3 concordando é uma tese mais
  // coerente do que sinais mistos entre horizontes.
  const presentDirs = horizons.map((h) => item.byHorizon[h]?.direction).filter(Boolean)
  let alinhamentoBadge = ''
  if (presentDirs.length >= 2) {
    const allSame = presentDirs.every((d) => d === presentDirs[0])
    alinhamentoBadge = allSame
      ? `<span class="pred-align aligned" title="D, S e M concordam na direção">${directionArrow(presentDirs[0])} alinhado</span>`
      : `<span class="pred-align mixed" title="Os horizontes não concordam entre si">sinais mistos</span>`
  }

  const cols = horizons
    .map((h) => {
      const p = item.byHorizon[h]
      const dateLabel = `<span class="pred-h-label" title="${HORIZON_LABELS[h]}">${HORIZON_LETTER[h]}·${fmtShortDate(p?.target_date)}</span>`
      if (!p) return `<div class="pred-h-col"><div class="pred-h-row">${dateLabel}<span class="muted" style="font-size:0.75rem">sem palpite</span></div></div>`
      const dir = directionClass(p.direction)
      const range = p.magnitude_min_pct != null && p.magnitude_max_pct != null ? `${p.magnitude_min_pct}% a ${p.magnitude_max_pct}%` : ''
      const est = estimateRange(p.reference_price, p.magnitude_min_pct, p.magnitude_max_pct, p.direction)
      const estText = est ? `→ ${fmtPrice(est.lo)} a ${fmtPrice(est.hi)}` : ''
      const rationale = p.rationale ? `<details class="pred-details" style="margin-top:0.3rem"><summary>tese</summary><p class="detail-rationale">${escapeHtml(p.rationale)}</p></details>` : ''

      // Item 1: mudança vs. o palpite de ontem pro mesmo ativo+horizonte
      // — "MANTÉM" persistente é uma tese diferente de "VIROU" recente.
      const ontem = ontemByKey?.[item.instrumentId + '|' + h]
      let mudancaBadge = ''
      if (ontem) {
        if (ontem.direction !== p.direction) {
          mudancaBadge = `<span class="pred-change virou" title="Ontem era ${ontem.direction}">VIROU ${directionArrow(p.direction)}</span>`
        } else {
          const deltaConf = p.confidence_pct - ontem.confidence_pct
          if (Math.abs(deltaConf) >= 5) {
            mudancaBadge = `<span class="pred-change ${deltaConf > 0 ? 'reforcou' : 'enfraqueceu'}" title="Ontem: ${ontem.confidence_pct}%">CONV ${deltaConf > 0 ? '+' : ''}${deltaConf}pp</span>`
          } else {
            mudancaBadge = `<span class="pred-change mantem" title="Mesma direção e convicção parecida desde ontem">MANTÉM</span>`
          }
        }
      }

      return `
        <div class="pred-h-col dir-${dir}${h === '1D' ? ' horizon-d' : ''}">
          <div class="pred-h-row">
            ${dateLabel}
            <span class="pred-dir ${dir}">${directionArrow(p.direction)}</span>
            <span class="pred-conf ${confClass(p.confidence_pct)}" title="Convicção declarada pela IA">conv. ${p.confidence_pct}%</span>
          </div>
          <div class="pred-range">${range}<span class="pred-est">${estText}</span></div>
          ${mudancaBadge ? `<div style="margin-top:0.3rem">${mudancaBadge}</div>` : ''}
          <div id="rast-${item.sym}-${h}" class="pred-h-detail-slot"><p class="muted" style="font-size:0.75rem">carregando…</p></div>
          ${rationale}
        </div>
      `
    })
    .join('')

  return `
    <div class="pred-instrument-block">
      <div class="pred-inst-header">
        <span class="pred-symbol-big">${sym}</span>
        <span class="pred-name">${name}</span>
        ${alinhamentoBadge}
        ${accBadge}
        ${current != null ? `<span class="pred-current">atual: ${fmtPrice(current)}</span>` : ''}
      </div>
      <div class="pred-horizons-grid">${cols}</div>
    </div>
  `
}

const FLUXO_LABELS = { entrada: 'Positivo', saida: 'Negativo', neutro: 'Neutro' }

function renderPredictions(preds, latestBySymbol, accuracyByInstrument, fluxos, predsOntem) {
  if (!preds || preds.length === 0) {
    return `<p class="muted">Nenhum palpite gerado ainda.</p>`
  }

  const fluxoByClass = {}
  for (const f of fluxos || []) fluxoByClass[f.asset_class] = f

  // Item 1: lookup do palpite de ontem por ativo+horizonte, pra
  // detectar mudança de direção/convicção.
  const ontemByKey = {}
  for (const p of predsOntem || []) {
    ontemByKey[p.instrument_id + '|' + p.horizon] = p
  }

  const byInstrument = {}
  for (const p of preds) {
    const sym = p.instruments?.symbol_internal || '?'
    if (!byInstrument[sym]) byInstrument[sym] = { sym, name: p.instruments?.name, cls: p.instruments?.asset_class, instrumentId: p.instrument_id, byHorizon: {} }
    byInstrument[sym].byHorizon[p.horizon] = p
  }

  const byClass = {}
  const order = []
  for (const item of Object.values(byInstrument)) {
    const cls = item.cls || 'outros'
    if (!byClass[cls]) { byClass[cls] = []; order.push(cls) }
    byClass[cls].push(item)
  }

  return order.map(cls => {
    const items = byClass[cls]
    const f = fluxoByClass[cls]
    const fluxoHtml = f
      ? `
      <div class="class-fluxo">
        <span class="fluxo-status ${f.status}" title="Positivo = apetite por risco entrando; Negativo = apetite por risco saindo; Neutro = sem direção clara">${FLUXO_LABELS[f.status] || f.status}</span>
        <span class="fluxo-motivo">${escapeHtml(f.motivo)}</span>
      </div>
    `
      : ''
    return `
      <div class="class-group">
        <div class="pred-class-title">${ASSET_CLASS_LABELS[cls] || cls} (${items.length})</div>
        ${fluxoHtml}
        ${items.map((item) => renderPredictionInstrument(item, latestBySymbol, accuracyByInstrument, ontemByKey)).join('')}
      </div>
    `
  }).join('')
}

function renderCenarios(cenarios) {
  if (!cenarios || cenarios.length === 0) return `<p class="muted">Cenários ainda não gerados hoje.</p>`
  const order = ['expansao', 'base', 'estresse']
  const sorted = [...cenarios].sort((a, b) => order.indexOf(a.tipo) - order.indexOf(b.tipo))

  return sorted
    .map(
      (c) => `
    <div class="cenario-block">
      <div class="cenario-top">
        <span class="cenario-tipo ${c.tipo}">${CENARIO_LABELS[c.tipo] || c.tipo}</span>
        ${c.probabilidade != null ? `<span class="cenario-prob">${Number(c.probabilidade).toFixed(0)}%</span>` : ''}
      </div>
      <p class="cenario-condicao"><strong>Se:</strong> ${escapeHtml(c.condicao)}</p>
      <p class="cenario-efeito"><strong>Então:</strong> ${escapeHtml(c.efeito_esperado)}</p>
      ${
        (c.favorece && c.favorece.length > 0) || (c.pressiona && c.pressiona.length > 0)
          ? `<div style="margin-top:0.4rem;display:flex;gap:1.5rem;flex-wrap:wrap">
              ${
                c.favorece && c.favorece.length > 0
                  ? `<span style="font-size:0.78rem"><span class="muted">Favorece: </span>${c.favorece.map((a) => `<span class="tag" style="color:var(--risk-on-strong);background:rgba(63,214,126,0.15)">${escapeHtml(a)}</span>`).join('')}</span>`
                  : ''
              }
              ${
                c.pressiona && c.pressiona.length > 0
                  ? `<span style="font-size:0.78rem"><span class="muted">Pressiona: </span>${c.pressiona.map((a) => `<span class="tag" style="color:var(--risk-off-strong);background:rgba(240,69,60,0.15)">${escapeHtml(a)}</span>`).join('')}</span>`
                  : ''
              }
            </div>`
          : ''
      }
      ${c.invalida_se ? `<p class="muted" style="font-size:0.75rem;margin-top:0.4rem"><strong>Invalida se:</strong> ${escapeHtml(c.invalida_se)}</p>` : ''}
    </div>
  `
    )
    .join('')
}

function highlightPct(text) {
  if (!text) return ''
  return escapeHtml(text)
    .replace(/([-+]?\d+[.,]?\d*%)/g, '<strong class="prose-highlight">$1</strong>')
    .replace(/(\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b)/g, '<strong class="prose-highlight-date">$1</strong>')
}

function renderAnaliseKpi(conc, cenarios, cenariosOntem) {
  const alertCount = Array.isArray(conc?.sinais_alerta) ? conc.sinais_alerta.length : 0
  const withProb = (cenarios || []).filter((c) => c.probabilidade != null)
  const topCenario = withProb.length > 0 ? [...withProb].sort((a, b) => Number(b.probabilidade) - Number(a.probabilidade))[0] : null

  const crossAsset = Array.isArray(conc?.confirmacao_cross_asset) ? conc.confirmacao_cross_asset : []
  const confirmam = crossAsset.filter((c) => c.status === 'confirma').length
  const naoConfirmam = crossAsset.filter((c) => c.status === 'nao_confirma').length

  if (!topCenario && alertCount === 0 && crossAsset.length === 0) return ''

  // Painel de Convicção: compara a probabilidade do MESMO tipo de
  // cenário (ex: Base) entre hoje e o dia anterior disponível — "50%
  // hoje" sozinho diz menos que "caiu de 60% pra 50%".
  let mudancaHtml = ''
  if (topCenario && cenariosOntem && cenariosOntem.length > 0) {
    const ontemMesmoTipo = cenariosOntem.find((c) => c.tipo === topCenario.tipo)
    if (ontemMesmoTipo && ontemMesmoTipo.probabilidade != null) {
      const delta = Number(topCenario.probabilidade) - Number(ontemMesmoTipo.probabilidade)
      if (Math.abs(delta) >= 1) {
        const seta = delta > 0 ? '↑' : '↓'
        const cor = 'var(--accent)'
        mudancaHtml = `<span style="color:${cor}" title="Era ${Number(ontemMesmoTipo.probabilidade).toFixed(0)}% no dia anterior">${seta} ${Math.abs(delta).toFixed(0)}pp vs. dia anterior</span>`
      } else {
        mudancaHtml = `<span class="muted">→ estável vs. dia anterior</span>`
      }
    }
  }

  // Resumo rápido de quantas classes confirmam a narrativa — leitura
  // "sustentada por 5 de 7 classes" é diferente de "sustentada por 2".
  let crossAssetHtml = ''
  if (crossAsset.length > 0) {
    const cor = naoConfirmam > confirmam ? 'var(--neutral)' : confirmam > 0 ? 'var(--accent)' : 'var(--text-faint)'
    crossAssetHtml = `<span style="color:${cor}" title="${confirmam} confirmam, ${naoConfirmam} não confirmam, ${crossAsset.length - confirmam - naoConfirmam} neutras"><strong>${confirmam}/${crossAsset.length}</strong> classes confirmam</span>`
  }

  // Mostra os 3 cenários no resumo (não só o mais provável) — dá a
  // visão completa da distribuição sem precisar rolar até a seção.
  const order = ['expansao', 'base', 'estresse']
  const cenariosSummaryHtml =
    withProb.length > 0
      ? `<span>${order
          .map((tipo) => {
            const c = withProb.find((x) => x.tipo === tipo)
            if (!c) return ''
            const isTop = topCenario && c.tipo === topCenario.tipo
            return `<span style="${isTop ? 'font-weight:700' : 'color:var(--text-muted)'}">${CENARIO_LABELS[tipo]} ${Number(c.probabilidade).toFixed(0)}%</span>`
          })
          .filter(Boolean)
          .join(' <span class="muted">·</span> ')}</span>`
      : ''

  return `
    <div class="track-horizon-row" style="margin-bottom:1.5rem;padding-top:0;border-top:none;">
      ${cenariosSummaryHtml}
      ${mudancaHtml}
      ${crossAssetHtml}
      <span style="color:var(--neutral)"><strong>${alertCount}</strong> sinais de alerta hoje</span>
    </div>
  `
}

function renderSynthesis(conc) {
  if (!conc) return `<p class="muted">Síntese ainda não gerada hoje.</p>`

  const alertas = Array.isArray(conc.sinais_alerta) ? conc.sinais_alerta : []
  const precisa = Array.isArray(conc.o_que_mercado_precisa) ? conc.o_que_mercado_precisa : []
  const temEstruturado = conc.driver_do_dia || conc.narrativa_dominante || alertas.length > 0 || precisa.length > 0

  // Fallback pra dias gravados antes da reestruturação (só tinham "texto")
  if (!temEstruturado && conc.texto) {
    const paragraphs = conc.texto.split('\n').filter(p => p.trim()).map(p => `<p>${highlightPct(p)}</p>`).join('')
    return `<div class="prose">${paragraphs}</div>`
  }

  // Quebra em parágrafos (a IA é instruída a separar com \n\n) — se por
  // algum motivo vier tudo grudado, cai num parágrafo só, sem quebrar.
  const asParagraphs = (text) =>
    text
      .split(/\n+/)
      .map((p) => p.trim())
      .filter(Boolean)
      .map((p) => `<p class="prose-p">${highlightPct(p)}</p>`)
      .join('')

  const blocks = []

  if (conc.driver_do_dia) {
    blocks.push(`
      <div class="synth-block">
        <div class="synth-label">🎯 O que mudou hoje</div>
        ${asParagraphs(conc.driver_do_dia)}
      </div>
    `)
  }

  if (conc.drivers_ainda_ativos) {
    blocks.push(`
      <div class="synth-block">
        <div class="synth-label" style="color:var(--text-muted)">📌 Ainda em jogo</div>
        <p class="prose-p" style="color:var(--text-muted)">${highlightPct(conc.drivers_ainda_ativos)}</p>
      </div>
    `)
  }

  if (conc.correlacao_do_dia) {
    blocks.push(`
      <div class="synth-block">
        <div class="synth-label">🔗 Correlação do dia</div>
        <p class="prose-p">${highlightPct(conc.correlacao_do_dia)}</p>
      </div>
    `)
  }

  if (conc.narrativa_dominante) {
    blocks.push(`
      <div class="synth-block">
        <div class="synth-label">📖 Narrativa dominante</div>
        ${asParagraphs(conc.narrativa_dominante)}
      </div>
    `)
  }

  if (conc.regime_condicional) {
    blocks.push(`
      <div class="synth-block">
        <div class="synth-label">🎚 Regime pode mudar se</div>
        <p class="prose-p">${highlightPct(conc.regime_condicional)}</p>
      </div>
    `)
  }

  if (conc.divergencia_sinais) {
    blocks.push(`
      <div class="synth-block">
        <div class="synth-label">🧭 Divergência de sinais</div>
        <p class="prose-p">${highlightPct(conc.divergencia_sinais)}</p>
      </div>
    `)
  }

  if (conc.confirmacao_cross_asset && conc.confirmacao_cross_asset.length > 0) {
    const STATUS_ICON = { confirma: '✓', nao_confirma: '✗', neutro: '~' }
    const STATUS_COLOR = { confirma: 'var(--risk-on-strong)', nao_confirma: 'var(--risk-off-strong)', neutro: 'var(--text-faint)' }
    const CLASSE_LABELS = { juros: 'Juros', dolar: 'Dólar', credito: 'Crédito', equities: 'Ações', amplitude: 'Amplitude', vix: 'VIX', cripto: 'Cripto' }
    blocks.push(`
      <div class="synth-block">
        <div class="synth-label">🧩 Confirmação cross-asset</div>
        <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:0.5rem">
          ${conc.confirmacao_cross_asset
            .map(
              (c) => `
            <span title="${escapeHtml(c.nota)}" style="font-size:0.85rem;cursor:help">
              ${escapeHtml(CLASSE_LABELS[c.classe] || c.classe)} <strong style="color:${STATUS_COLOR[c.status] || 'var(--text-faint)'}">${STATUS_ICON[c.status] || '?'}</strong>
            </span>
          `
            )
            .join('')}
        </div>
      </div>
    `)
  }

  if (alertas.length > 0) {
    blocks.push(`
      <div class="synth-block alert">
        <div class="synth-label">⚠ Sinais de alerta (${alertas.length})</div>
        <ul class="synth-list">${alertas.map((a) => `<li>${highlightPct(a)}</li>`).join('')}</ul>
      </div>
    `)
  }

  if (precisa.length > 0) {
    blocks.push(`
      <div class="synth-block">
        <div class="synth-label">🧭 Próximos gatilhos</div>
        <ul class="synth-list">${precisa.map((p) => `<li>${highlightPct(p)}</li>`).join('')}</ul>
      </div>
    `)
  }

  return blocks.join('') || `<p class="muted">Síntese ainda não gerada hoje.</p>`
}

function matchesKeyword(name, keywords, contextKeywords) {
  const lower = (name || '').toLowerCase()
  const hasMain = keywords.some((k) => lower.includes(k))
  if (!hasMain) return false
  // Pra casos como "Fed"/"BCE" onde a palavra sozinha aparece em
  // contexto que não tem nada a ver com decisão de juros (ex: notícia
  // de fusão de banco mencionando "BCE" de passagem) — exige também
  // uma palavra de contexto de política monetária.
  if (contextKeywords && contextKeywords.length > 0) {
    return contextKeywords.some((k) => lower.includes(k))
  }
  return true
}

function direcaoBolsaEmoji(dir) {
  if (dir === 'sobe') return '📈'
  if (dir === 'desce') return '📉'
  if (dir === 'neutro') return '➡️'
  return ''
}

function vsConsensusColor(vs) {
  if (vs === 'acima') return 'var(--risk-on-strong)'
  if (vs === 'abaixo') return 'var(--risk-off-strong)'
  if (vs === 'sem_consenso') return 'var(--accent)'
  return 'var(--text-faint)'
}
function vsConsensusBg(vs) {
  if (vs === 'acima') return 'rgba(63,214,126,0.15)'
  if (vs === 'abaixo') return 'rgba(240,69,60,0.15)'
  if (vs === 'sem_consenso') return 'rgba(79,184,174,0.15)'
  return 'var(--surface-2)'
}

// Um card por dado real: cor mostra se veio acima/abaixo/em linha
// (não é bom/ruim automaticamente — isso varia por indicador, é
// exatamente o que o "detalhe" abaixo explica).
function renderMacroDadoCard(m, linkedNews) {
  const vsLabel = VS_CONSENSUS_LABELS[m.vs_consensus] || m.vs_consensus || '?'
  const newsHtml =
    linkedNews && linkedNews.length > 0
      ? `<details class="pred-details" style="margin-top:0.3rem"><summary>notícias (${linkedNews.length})</summary>${linkedNews
          .map((n) => `<p><strong>${escapeHtml(n.headline)}:</strong> ${escapeHtml(n.summary || '')}</p>`)
          .join('')}</details>`
      : ''
  return `
    <div style="margin-bottom:0.4rem">
      <p style="font-size:0.75rem">
        <span class="muted">Atual: </span>${escapeHtml(m.result || '')}${m.consensus ? ` · consenso: ${escapeHtml(m.consensus)}` : ''}
        <span class="tag" style="color:${vsConsensusColor(m.vs_consensus)};background:${vsConsensusBg(m.vs_consensus)};margin-left:0.3rem">${vsLabel}</span>
      </p>
      <p class="muted" style="font-size:0.66rem;margin-top:0.1rem">divulgado em ${m.release_date ? fmtShortDate(m.release_date) : 'data incerta'}</p>
      <p style="font-size:0.72rem;margin-top:0.2rem"><span class="muted">Anterior: </span>${m.anterior ? escapeHtml(m.anterior) : '<span class="muted">—</span>'}</p>
      ${m.impact ? `<details class="pred-details" style="margin-top:0.2rem"><summary>o que isso significa</summary><p>${escapeHtml(m.impact)}</p></details>` : ''}
      ${newsHtml}
    </div>
  `
}

// Estado bruto guardado aqui pra os filtros (data/importância) poderem
// recalcular só a grade, sem precisar buscar tudo de novo no banco.
let macroChecklistData = { macro: [], radarMacro: [] }
let selectedMarketDate = null

function macroImportanceScore(text) {
  const lower = (text || '').toLowerCase()
  if (/\b(cpi|ipca|pce|fed|fomc|copom|bce|ecb|payroll|nfp|emprego|desemprego|jolts)\b/.test(lower)) return 3
  if (/\b(pib|gdp|varejo|retail|pmi|industrial)\b/.test(lower)) return 2
  return 1
}

function guessCountryFromText(text) {
  const lower = (text || '').toLowerCase()
  if (lower.includes('brasil') || lower.includes('brazil')) return 'brasil'
  if (lower.includes('eua') || lower.includes('estados unidos') || lower.includes('united states')) return 'eua'
  if (lower.includes('europa') || lower.includes('zona do euro') || lower.includes('eurozone') || lower.includes('euro area')) return 'europa'
  if (lower.includes('china') || lower.includes('chinesa') || lower.includes('chinês')) return 'china'
  if (lower.includes('reino unido') || lower.includes('united kingdom') || lower.includes(' uk ') || lower.includes('britânic') || lower.includes('british')) return 'reino_unido'
  return null
}

// O prompt do collect-macro-data pede "últimos 5-7 dias" toda noite —
// o mesmo dado real (ex: CPI de julho) pode ser recapturado várias
// noites seguidas, com o número dito de formas diferentes (ordem,
// nível de detalhe) e, às vezes, com a data levemente errada de uma
// captura pra outra. Agrupa por resultado da comparação (acima/
// abaixo/em linha) + data DENTRO de uma janela de 5 dias uma da
// outra + pelo menos 1 palavra significativa em comum no nome do
// indicador (evita juntar "Payroll" com "Desemprego" só porque os
// dois vieram "abaixo" e caem na mesma categoria "Mercado de
// Trabalho") — mantém a versão com mais detalhe (texto mais longo),
// descarta o resto. Devolve do mais recente pro mais antigo.
function significantWords(text) {
  const stopwords = new Set(['de', 'do', 'da', 'em', 'no', 'na', 'o', 'a', 'e', 'dos', 'das', 'com', 'para', 'por'])
  return new Set(
    (text || '')
      .toLowerCase()
      .replace(/[()]/g, ' ')
      .split(/\s+/)
      .filter((w) => w.length > 2 && !stopwords.has(w) && !/^\d+$/.test(w))
  )
}
function dedupeByResult(items) {
  const sorted = [...items].sort((a, b) => (a.release_date || '9999-99-99').localeCompare(b.release_date || '9999-99-99'))
  const groups = []
  for (const m of sorted) {
    const mWords = significantWords(m.indicator_name)
    const group = groups.find((g) => {
      const last = g[g.length - 1]
      if ((last.vs_consensus || '') !== (m.vs_consensus || '')) return false
      if (!last.release_date || !m.release_date) {
        if (!(!last.release_date && !m.release_date)) return false
      } else {
        const diffDays = Math.abs((new Date(m.release_date + 'T12:00:00') - new Date(last.release_date + 'T12:00:00')) / (1000 * 60 * 60 * 24))
        if (diffDays > 5) return false
      }
      const lastWords = significantWords(last.indicator_name)
      return [...mWords].some((w) => lastWords.has(w))
    })
    if (group) group.push(m)
    else groups.push([m])
  }
  return groups
    .map((g) => g.reduce((best, cur) => ((cur.result || '').length > (best.result || '').length ? cur : best)))
    .sort((a, b) => (b.release_date || '').localeCompare(a.release_date || ''))
}

function newsMatchedChecklistItem(n) {
  return MACRO_CHECKLIST.find((ci) => {
    const paisOk = !n.pais || n.pais === ci.pais
    return paisOk && matchesKeyword(n.headline + ' ' + (n.summary || ''), ci.keywords, ci.contextKeywords)
  })
}

function updateMacroChecklistGrid() {
  const grid = document.getElementById('macro-checklist-grid')
  if (!grid) return

  const today = todayBRTClient()
  const { macro, radarMacro } = macroChecklistData
  const matchedMacroIds = new Set()

  // Próximas divulgações — os 5 mais próximos do Radar de tema macro,
  // só data + o quê + bandeira, resumo compacto do "Próximo" que já
  // aparece espalhado em cada card individual.
  const proximosEl = document.getElementById('macro-proximos-list')
  if (proximosEl) {
    const proximos = (radarMacro || [])
      .filter((r) => r.expected_date && r.expected_date >= today)
      .sort((a, b) => a.expected_date.localeCompare(b.expected_date))
      .slice(0, 5)
    proximosEl.innerHTML =
      proximos.length > 0
        ? proximos
            .map(
              (r) => `
        <div class="item" style="padding:0.5rem 0.75rem;">
          <span class="when">${fmtDate(r.expected_date)}</span>
          <p class="headline" style="font-size:0.82rem">${PAIS_FLAGS[r.pais] || ''} ${escapeHtml(r.description)}</p>
        </div>
      `
            )
            .join('')
        : `<p class="muted">Nada previsto no momento.</p>`
  }

  // KPI = todo dado real resolvido — os 12 fixos sempre aparecem (com
  // dado ou "sem dado ainda"), mais qualquer dado real fora dos 12
  // ("não catalogado"). Nada de notícia/radar aqui — só número real.
  const checklistCards = MACRO_CHECKLIST.map((ci) => {
    const allMatches = macro.filter((m) => (m.pais || guessCountryFromText(m.indicator_name)) === ci.pais && matchesKeyword(m.indicator_name, ci.keywords, ci.contextKeywords))
    allMatches.forEach((m) => matchedMacroIds.add(m.indicator_name + '|' + m.release_date))
    const realized = dedupeByResult(allMatches)

    // "Próximo" é calculado sempre — faz sentido tanto quando já tem
    // dado (próxima divulgação do período seguinte) quanto quando não
    // tem nenhum ainda. Ignora Radar com data já vencida (senão fica
    // mostrando "próximo" uma data que já passou) — pega sempre a
    // data futura mais próxima, ou incerta se não tiver data nenhuma.
    const pendingMatch = radarMacro
      .filter((r) => (r.pais || guessCountryFromText(r.description)) === ci.pais && matchesKeyword(r.description, ci.keywords, ci.contextKeywords))
      .filter((r) => !r.expected_date || r.expected_date >= today)
      .sort((a, b) => (a.expected_date || '9999-99-99').localeCompare(b.expected_date || '9999-99-99'))[0]
    const proximoHtml = `<p style="font-size:0.72rem;margin-top:0.2rem"><span class="muted">Próximo: </span>${
      pendingMatch
        ? `<span style="color:var(--neutral)">${pendingMatch.expected_date ? fmtShortDate(pendingMatch.expected_date) : 'data incerta'}</span>`
        : '<span class="muted">—</span>'
    }</p>`

    let bodyHtml
    if (realized.length > 0) {
      bodyHtml = renderMacroDadoCard(realized[0], null) + proximoHtml
    } else {
      // Sem dado real ainda — mostra os 3 campos mesmo assim (Atual e
      // Último em branco), e sempre mostra "o que significa" (fixo,
      // escrito por mim), pra já entender o indicador antes do
      // primeiro dado chegar.
      const descHtml = ci.description
        ? `<details class="pred-details" style="margin-top:0.3rem"><summary>o que significa</summary><p>${escapeHtml(ci.description)}</p></details>`
        : ''
      bodyHtml = `
        <p style="font-size:0.75rem"><span class="muted">Atual: </span><span class="muted">—</span></p>
        <p style="font-size:0.72rem;margin-top:0.15rem"><span class="muted">Anterior: </span><span class="muted">—</span></p>
        ${proximoHtml}
        ${descHtml}
      `
    }

    const direcaoEmoji = realized.length > 0 ? direcaoBolsaEmoji(realized[0].direcao_bolsa) : ''

    return {
      score: ci.weight,
      pais: ci.pais,
      hasData: realized.length > 0,
      vsConsensus: realized.length > 0 ? realized[0].vs_consensus : null,
      direcaoBolsa: realized.length > 0 ? realized[0].direcao_bolsa : null,
      html: `
        <div class="theme-card">
          <div class="theme-card-title" style="display:flex;justify-content:space-between;align-items:center;">
            <span>${PAIS_FLAGS[ci.pais] || ''} ${ci.label}</span>
            ${direcaoEmoji ? `<span title="Tendência esperada pra bolsa">${direcaoEmoji}</span>` : ''}
          </div>
          ${ci.subtitle ? `<div class="muted" style="font-size:0.62rem;margin-top:-0.3rem">${escapeHtml(ci.subtitle)}</div>` : ''}
          <div style="margin-top:0.4rem">${bodyHtml}</div>
        </div>
      `,
    }
  })

  // Dado real fora dos 12 — agrupa por tópico (nome varia entre
  // coletas: "PPI de julho" e "PPI dos EUA (julho)" são o mesmo
  // evento) antes de deduplicar dentro do grupo.
  function extractTopicKey(text) {
    const stopwords = new Set(['dos', 'do', 'da', 'de', 'em', 'no', 'na', 'o', 'a', 'e', 'eua', 'brasil', 'europa', 'estados', 'unidos', 'zona', 'euro'])
    const cleaned = (text || '').toLowerCase().replace(/[()]/g, ' ')
    const words = cleaned.split(/\s+/).filter((w) => w && !stopwords.has(w) && !/^\d+$/.test(w))
    return words[0] || cleaned.trim()
  }

  const uncataloguedRaw = macro.filter((m) => !matchedMacroIds.has(m.indicator_name + '|' + m.release_date))
  const groupedUncat = {}
  const groupOrder = []
  for (const m of uncataloguedRaw) {
    const paisResolved = m.pais || guessCountryFromText(m.indicator_name)
    const key = (paisResolved || 'x') + '|' + extractTopicKey(m.indicator_name)
    if (!groupedUncat[key]) {
      groupedUncat[key] = { items: [], label: m.indicator_name, pais: paisResolved }
      groupOrder.push(key)
    }
    groupedUncat[key].items.push(m)
    if (m.indicator_name.length < groupedUncat[key].label.length) groupedUncat[key].label = m.indicator_name
  }

  const uncataloguedCards = groupOrder.map((key) => {
    const g = groupedUncat[key]
    const paisTag = g.pais ? `${PAIS_FLAGS[g.pais] || ''} ` : ''
    const deduped = dedupeByResult(g.items)
    return {
      score: macroImportanceScore(g.label),
      pais: g.pais,
      hasData: true,
      vsConsensus: deduped[0]?.vs_consensus || null,
      direcaoBolsa: deduped[0]?.direcao_bolsa || null,
      html: `
        <div class="theme-card">
          <div class="theme-card-title">${paisTag}${escapeHtml(g.label)}${!g.pais ? ' · não classificado' : ''} <span class="type-badge type-expired" style="margin-left:0.3rem">NÃO CATALOGADO</span></div>
          <div style="margin-top:0.4rem">${renderMacroDadoCard(deduped[0], null)}</div>
        </div>
      `,
    }
  })

  // Agrupa por país primeiro (mais fácil de escanear), importância só
  // decide a ordem dentro de cada país — não catalogados sem país vão
  // pro final.
  const PAIS_ORDER = ['brasil', 'eua', 'europa', 'china', 'reino_unido']
  const allCards = [...checklistCards, ...uncataloguedCards].sort((a, b) => {
    const pa = PAIS_ORDER.indexOf(a.pais)
    const pb = PAIS_ORDER.indexOf(b.pais)
    const ia = pa === -1 ? PAIS_ORDER.length : pa
    const ib = pb === -1 ? PAIS_ORDER.length : pb
    if (ia !== ib) return ia - ib
    return b.score - a.score
  })
  grid.innerHTML = allCards.map((c) => c.html).join('')

  const totalEl = document.getElementById('kpi-total-count')
  if (totalEl) totalEl.textContent = allCards.length

  const aguardandoEl = document.getElementById('kpi-aguardando-count')
  if (aguardandoEl) aguardandoEl.textContent = checklistCards.filter((c) => !c.hasData).length

  // Conta a partir do MESMO conjunto de cards exibidos (não da lista
  // bruta do banco) — assim monitorados = aguardando + soma destes 4.
  const vsCounts = { acima: 0, abaixo: 0, em_linha: 0, sem_consenso: 0 }
  for (const c of allCards) {
    if (c.vsConsensus && vsCounts[c.vsConsensus] != null) vsCounts[c.vsConsensus]++
  }
  const acimaEl = document.getElementById('kpi-acima-count')
  if (acimaEl) acimaEl.textContent = vsCounts.acima
  const abaixoEl = document.getElementById('kpi-abaixo-count')
  if (abaixoEl) abaixoEl.textContent = vsCounts.abaixo
  const emLinhaEl = document.getElementById('kpi-emlinha-count')
  if (emLinhaEl) emLinhaEl.textContent = vsCounts.em_linha
  const semConsensoEl = document.getElementById('kpi-semconsenso-count')
  if (semConsensoEl) semConsensoEl.textContent = vsCounts.sem_consenso

  const direcaoCounts = { sobe: 0, desce: 0, neutro: 0 }
  for (const c of allCards) {
    if (c.direcaoBolsa && direcaoCounts[c.direcaoBolsa] != null) direcaoCounts[c.direcaoBolsa]++
  }
  const sobeEl = document.getElementById('kpi-sobe-count')
  if (sobeEl) sobeEl.textContent = `📈 ${direcaoCounts.sobe}`
  const desceEl = document.getElementById('kpi-desce-count')
  if (desceEl) desceEl.textContent = `📉 ${direcaoCounts.desce}`
  const neutroEl = document.getElementById('kpi-neutro-count')
  if (neutroEl) neutroEl.textContent = `➡️ ${direcaoCounts.neutro}`
}
