<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Mercado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #10131a;
    --surface: #191e29;
    --surface-2: #222838;
    --border: #2b3244;
    --text: #edeef3;
    --text-muted: #9298ab;
    --text-faint: #5c6377;
    --accent: #4fb8ae;
    --accent-soft: rgba(79, 184, 174, 0.14);
    --risk-on: #5ebd8b;
    --risk-on-strong: #3fd67e;
    --risk-off: #e0665f;
    --risk-off-strong: #f0453c;
    --neutral: #e8b04b;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    line-height: 1.5;
    padding-bottom: 4rem;
  }

  a { color: var(--accent); }

  ::selection { background: var(--accent-soft); }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 1.25rem 1.1rem;
  }

  @media (min-width: 900px) {
    .wrap { max-width: 1160px; padding: 1.75rem 2rem; }
  }

  .dashboard-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }

  @media (min-width: 900px) {
    .dashboard-grid { grid-template-columns: 340px 1fr; align-items: start; }
    .col-side { position: sticky; top: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
  }

  .below-grid { margin-top: 1.75rem; }

  .stale-note {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--neutral);
    background: rgba(232, 176, 75, 0.08);
    border: 1px solid rgba(232, 176, 75, 0.25);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    margin-bottom: 1.25rem;
  }

  .health-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 0.4rem;
    vertical-align: middle;
  }
  .health-dot.ok { background: var(--risk-on-strong); }
  .health-dot.warn { background: var(--neutral); }
  .health-dot.error { background: var(--risk-off-strong); }
  .health-dot.muted { background: var(--text-faint); }

  .health-banner {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    margin-bottom: 1.25rem;
  }
  .health-banner.warn {
    color: var(--neutral);
    background: rgba(232, 176, 75, 0.08);
    border: 1px solid rgba(232, 176, 75, 0.25);
  }
  .health-banner.error {
    color: var(--risk-off-strong);
    background: rgba(240, 69, 60, 0.08);
    border: 1px solid rgba(240, 69, 60, 0.25);
  }

  .trace-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    padding: 0.35rem 0;
    border-bottom: 1px solid var(--border);
  }
  .trace-row:last-child { border-bottom: none; }

  .veredito-block { padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
  .veredito-block:last-child { border-bottom: none; }
  .veredito-row { display: flex; justify-content: space-between; align-items: center; }
  .veredito-mercado { font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem; }
  .veredito-decisao {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    font-weight: 700;
  }
  .veredito-decisao.compra { color: var(--risk-on-strong); background: rgba(63, 214, 126, 0.1); }
  .veredito-decisao.venda { color: var(--risk-off-strong); background: rgba(240, 69, 60, 0.1); }
  .veredito-decisao.fora { color: var(--text-faint); background: var(--surface-2); }
  .veredito-razao { font-size: 0.8rem; color: var(--text-muted); margin: 0.35rem 0 0; }

  .cenario-block { padding: 0.85rem 0; border-bottom: 1px solid var(--border); }
  .cenario-block:last-child { border-bottom: none; }
  .cenario-tipo {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    margin-bottom: 0.4rem;
    display: inline-block;
  }
  .cenario-tipo.expansao { color: var(--risk-on-strong); }
  .cenario-tipo.base { color: var(--text-muted); }
  .cenario-tipo.estresse { color: var(--risk-off-strong); }
  .cenario-condicao { font-size: 0.85rem; color: var(--text); margin: 0 0 0.3rem; }
  .cenario-efeito { font-size: 0.82rem; color: var(--text-muted); margin: 0; }

  .fluxo-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
  }
  .fluxo-row:last-child { border-bottom: none; }
  .fluxo-motivo { color: var(--text-faint); font-size: 0.72rem; margin-top: 0.15rem; }
  .fluxo-status {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .fluxo-status.entrada { color: var(--risk-on-strong); background: rgba(63, 214, 126, 0.1); }
  .fluxo-status.saida { color: var(--risk-off-strong); background: rgba(240, 69, 60, 0.1); }
  .fluxo-status.neutro { color: var(--text-faint); background: var(--surface-2); }

  .driver-row { padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
  .driver-row:last-child { border-bottom: none; }
  .driver-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
  .driver-nome { font-weight: 600; font-size: 0.85rem; }
  .driver-tendencia { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-faint); flex-shrink: 0; }
  .driver-bar-track { width: 100%; height: 5px; background: var(--surface-2); border-radius: 3px; margin: 0.4rem 0; overflow: hidden; }
  .driver-bar-fill { height: 100%; }
  .driver-bar-fill.positivo { background: var(--risk-on-strong); }
  .driver-bar-fill.negativo { background: var(--risk-off-strong); }
  .driver-bar-fill.misto { background: var(--neutral); }
  .driver-next { font-size: 0.78rem; color: var(--text-muted); margin: 0.3rem 0 0; }
  .driver-tema { font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-faint); text-transform: uppercase; }

  .progress-row { padding: 0.7rem 0; border-bottom: 1px solid var(--border); }
  .progress-row:last-child { border-bottom: none; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
  .progress-symbol { font-weight: 600; font-size: 0.85rem; }
  .progress-status {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .progress-status.ok { color: var(--risk-on-strong); background: rgba(63, 214, 126, 0.1); }
  .progress-status.off { color: var(--risk-off-strong); background: rgba(240, 69, 60, 0.1); }
  .progress-detail { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
  .progress-detail:first-of-type { margin-top: 0.3rem; }

  .config-group { margin-bottom: 1.25rem; }
  .config-group:last-child { margin-bottom: 0; }
  .config-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border);
  }
  .config-row:last-child { border-bottom: none; }
  .config-key { font-family: var(--font-mono); font-size: 0.78rem; }
  .config-desc { font-size: 0.7rem; color: var(--text-faint); margin-top: 0.1rem; }
  .config-value { font-family: var(--font-mono); font-weight: 600; font-size: 0.8rem; flex-shrink: 0; color: var(--accent); }
  .config-value.muted-value { color: var(--text-faint); font-weight: 400; }

  .signal-group-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    margin-bottom: 0.5rem;
  }
  .signal-chip-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.3rem 0;
    font-size: 0.85rem;
  }
  .signal-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.35rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .signal-row:last-child { border-bottom: none; }
  .signal-caveat {
    font-size: 0.72rem;
    color: var(--text-faint);
    margin: 0 0 0.85rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  .horizon-tabs {
    display: flex;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
  }
  .horizon-btn {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.3rem 0.7rem;
    border-radius: 6px;
    cursor: pointer;
  }
  .horizon-btn:hover { color: var(--text); }
  .horizon-btn.active {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  header.top h1 {
    font-family: var(--font-mono);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--text);
  }

  header.top .date {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: capitalize;
  }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.35rem;
  }

  .updated-badge {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-faint);
  }

  .refresh-btn {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 0.25rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--accent); }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; }

  .day-selector {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    cursor: pointer;
  }

  /* --- DESTAQUE DO DIA --- */
  .highlight-card {
    display: flex;
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.85rem 1.1rem;
    margin-top: 0.9rem;
    font-family: var(--font-mono);
    font-size: 0.78rem;
  }
  .highlight-card .hl-item { flex: 1; }
  .highlight-card .hl-label { color: var(--text-faint); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.2rem; }
  .highlight-card .hl-value { font-weight: 700; }

  /* --- F&G COMPONENTS --- */
  .fg-components {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem 1rem;
    margin-top: 0.85rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--border);
  }
  .fg-comp-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
  }
  .fg-comp-name { color: var(--text-muted); }
  .fg-comp-val { font-family: var(--font-mono); font-weight: 600; }

  section {
    margin-bottom: 1.75rem;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 0.6rem 0;
  }

  /* --- GAUGE --- */
  .gauge-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem 1.25rem 1.25rem;
    text-align: center;
  }

  .gauge-svg { width: 100%; max-width: 280px; height: auto; }

  .gauge-needle {
    transform-origin: 100px 105px;
    transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .gauge-score {
    font-family: var(--font-mono);
    font-size: 2rem;
    font-weight: 700;
    margin-top: -1.5rem;
  }

  .gauge-label {
    font-family: var(--font-mono);
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-top: 0.2rem;
  }

  .gauge-sub {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.6rem;
  }

  .fg-row {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }

  .fg-row .fg-val { font-weight: 700; }

  /* --- PREDICTIONS --- */
  .pred-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.65rem 0;
    border-bottom: 1px solid var(--border);
  }
  .pred-row:last-child { border-bottom: none; }

  .pred-symbol {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.85rem;
    width: 96px;
    flex-shrink: 0;
    line-height: 1.25;
  }
  .pred-symbol .pred-name {
    display: block;
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 0.66rem;
    color: var(--text-faint);
    white-space: normal;
  }

  .pred-dir {
    font-family: var(--font-mono);
    font-size: 1rem;
    font-weight: 700;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .pred-dir.up { color: var(--risk-on-strong); }
  .pred-dir.down { color: var(--risk-off-strong); }
  .pred-dir.flat { color: var(--text-faint); }

  .pred-range {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    flex: 1;
  }

  .pred-conf {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    width: 40px;
    text-align: right;
    flex-shrink: 0;
  }

  .pred-bar-track {
    width: 34px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .pred-bar-fill { height: 100%; background: var(--accent); }

  details.pred-details summary {
    cursor: pointer;
    color: var(--text-faint);
    font-size: 0.72rem;
    margin-top: 0.15rem;
  }
  details.pred-details p {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin: 0.4rem 0 0;
  }

  /* --- CARDS / GENERIC --- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }

  .prose { font-size: 0.92rem; color: var(--text); white-space: pre-line; }
  .prose p { margin: 0 0 0.9rem; }
  .prose p:last-child { margin-bottom: 0; }

  .synth-block { margin-bottom: 1.2rem; }
  .synth-block:last-child { margin-bottom: 0; }

  .synth-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    margin-bottom: 0.4rem;
  }
  .synth-block.alert .synth-label { color: var(--neutral); }

  .prose-p { font-size: 0.92rem; color: var(--text); margin: 0; line-height: 1.6; }

  .synth-list { list-style: none; margin: 0; padding: 0; }
  .synth-list li {
    position: relative;
    padding-left: 1.1rem;
    margin-bottom: 0.5rem;
    font-size: 0.88rem;
    color: var(--text);
    line-height: 1.5;
  }
  .synth-list li:last-child { margin-bottom: 0; }
  .synth-list li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--text-faint);
  }
  .synth-block.alert .synth-list li::before {
    content: '!';
    color: var(--neutral);
    font-weight: 700;
  }

  .stat-big {
    font-family: var(--font-mono);
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--accent);
  }

  .muted { color: var(--text-muted); font-size: 0.85rem; }

  /* --- NEWS / RADAR --- */
  .item {
    padding: 0.7rem 0 0.7rem 0.7rem;
    border-bottom: 1px solid var(--border);
    border-left: 3px solid transparent;
  }
  .item:last-child { border-bottom: none; }
  .item.cal-past { border-left-color: var(--text-faint); }
  .item.cal-future { border-left-color: var(--neutral); }

  .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--text-muted);
    margin-right: 0.4rem;
  }
  .tag.cal-tag-past { color: var(--text-faint); }
  .tag.cal-tag-future { color: var(--neutral); background: rgba(232, 176, 75, 0.08); }

  .calendar-impact {
    font-size: 0.8rem;
    color: var(--text);
    margin-top: 0.4rem;
    padding-top: 0.4rem;
    border-top: 1px dashed var(--border);
  }

  .item .headline { font-weight: 600; font-size: 0.88rem; margin: 0.35rem 0 0.15rem; }
  .item .summary { font-size: 0.82rem; color: var(--text-muted); margin: 0; }
  .item .when { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-faint); }

  /* --- SNAPSHOT --- */
  .class-group { margin-bottom: 1rem; }
  .class-title {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    margin-bottom: 0.4rem;
  }
  .snap-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem;
    font-family: var(--font-mono);
    font-size: 0.8rem;
    padding: 0.3rem 0;
    border-bottom: 1px solid var(--border);
  }
  .snap-row:last-child { border-bottom: none; }
  .snap-name {
    font-family: var(--font-sans);
    color: var(--text-faint);
    font-size: 0.7rem;
    margin-left: 0.4rem;
  }
  .snap-chg.up { color: var(--risk-on-strong); }
  .snap-chg.down { color: var(--risk-off-strong); }
  .snap-chg.flat { color: var(--text-faint); }

  .pred-more summary {
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--accent);
    padding: 0.3rem 0;
  }

  details.section-collapse > summary {
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0.3rem 0;
  }
  details.section-collapse[open] > summary { color: var(--text); margin-bottom: 0.75rem; }

  footer.foot {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-faint);
    margin-top: 2rem;
  }

  #loading {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }

  .error {
    background: var(--surface);
    border: 1px solid var(--risk-off);
    color: var(--risk-off);
    padding: 1rem;

function switchHorizon(h) {

  })

function escapeHtml(str) {
  if (str == null) return ''
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
}

function todayBRTClient() {
  const now = new Date()
  const brt = new Date(now.getTime() - 3 * 60 * 60 * 1000)
  return brt.toISOString().slice(0, 10)
}

function fmtDate(iso) {
  if (!iso) return ''
  const d = new Date(iso + 'T12:00:00Z')
  return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' })
}

function directionArrow(dir) { return dir === 'alta' ? '↑' : dir === 'baixa' ? '↓' : '→' }
function directionClass(dir) { return dir === 'alta' ? 'up' : dir === 'baixa' ? 'down' : 'flat' }

function gaugeAngle(score) {
  const clamped = Math.max(-100, Math.min(100, score))
  return (clamped / 100) * 90
}

function renderGauge(regimes) {
  const eua = (regimes || []).find(r => r.mercado === 'eua')
  const others = (regimes || []).filter(r => r.mercado !== 'eua')

  if (!eua) {
    return `<div class="gauge-card"><p class="muted">Regime ainda não calculado hoje.</p></div>`
  }

  const scoreNum = Number(eua.global_score)
  const angle = gaugeAngle(scoreNum)
  const color = REGIME_COLORS[eua.label] || 'var(--text-muted)'
  const otherLine = ['brasil', 'europa']
    .map(m => {
      const r = others.find(x => x.mercado === m)
      const name = m === 'brasil' ? 'Brasil' : 'Europa'
      return r ? `${name}: ${REGIME_LABELS[r.label]}` : `${name}: acumulando histórico`
    })
    .join(' · ')

  return `
    <div class="gauge-card">
      <svg class="gauge-svg" viewBox="0 0 200 120">
        <path d="M 15,105 A 85,85 0 0 1 50.0,36.2" stroke="var(--risk-off-strong)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M 50.0,36.2 A 85,85 0 0 1 80.2,22.3" stroke="var(--risk-off)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M 80.2,22.3 A 85,85 0 0 1 119.8,22.3" stroke="var(--neutral)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M 119.8,22.3 A 85,85 0 0 1 150.0,36.2" stroke="var(--risk-on)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M 150.0,36.2 A 85,85 0 0 1 185,105" stroke="var(--risk-on-strong)" stroke-width="14" fill="none" stroke-linecap="round"/>
        <line class="gauge-needle" x1="100" y1="105" x2="100" y2="28" stroke="var(--text)" stroke-width="3" stroke-linecap="round"
          style="transform: rotate(${angle}deg)"/>
        <circle cx="100" cy="105" r="5" fill="var(--text)"/>
      </svg>
      <div class="gauge-score" style="color:${color}">${scoreNum.toFixed(0)}</div>
      <div class="gauge-label" style="color:${color}">${REGIME_LABELS[eua.label]} · EUA</div>
      <div class="gauge-sub">${otherLine}</div>
    </div>
  `
}

function renderFearGreed(fg) {
  if (!fg) return ''
  const components = fg.fear_greed_components || []

          <span class="fg-comp-val">${Number(c.value).toFixed(0)}</span>

    : ''

    <div class="fg-row">
      <span>F&amp;G <span class="fg-val">${fg.index_value}</span> <span class="muted">(${fg.label})</span></span>
    </div>
    ${grid}
  `
}

function renderHighlights(latestBySymbol, instruments) {
  const analyzed = (instruments || []).filter(i => i.is_analyzed)
  const withChange = analyzed
    .map(i => ({ symbol: i.symbol_internal, change_pct: latestBySymbol[i.symbol_internal]?.change_pct }))
    .filter(x => x.change_pct != null)
    .map(x => ({ ...x, change_pct: Number(x.change_pct) }))

  if (withChange.length === 0) return ''

  const sorted = [...withChange].sort((a, b) => b.change_pct - a.change_pct)
  const top = sorted[0]
  const bottom = sorted[sorted.length - 1]

  return `
    <div class="highlight-card">
      <div class="hl-item">
        <span class="hl-label">Maior alta</span>
        <span class="hl-value" style="color:var(--risk-on-strong)">${top.symbol} +${top.change_pct.toFixed(2)}%</span>
      </div>
      <div class="hl-item">
        <span class="hl-label">Maior queda</span>
        <span class="hl-value" style="color:var(--risk-off-strong)">${bottom.symbol} ${bottom.change_pct.toFixed(2)}%</span>
      </div>
    </div>
  `
}

function renderPredictionRow(p) {
  const sym = escapeHtml(p.instruments?.symbol_internal || '?')
  const name = escapeHtml(p.instruments?.name || '')
  const dir = directionClass(p.direction)
  const range = (p.magnitude_min_pct != null && p.magnitude_max_pct != null)
    ? `${p.magnitude_min_pct}% a ${p.magnitude_max_pct}%` : ''
  return `
    <div class="pred-row">
      <span class="pred-symbol">${sym}<span class="pred-name">${name}</span></span>
      <span class="pred-dir ${dir}">${directionArrow(p.direction)}</span>
      <span class="pred-range">${range}</span>
      <span class="pred-bar-track"><span class="pred-bar-fill" style="width:${p.confidence_pct}%"></span></span>
      <span class="pred-conf">${p.confidence_pct}%</span>
    </div>
    ${p.rationale ? `<details class="pred-details"><summary>por quê</summary><p>${escapeHtml(p.rationale)}</p></details>` : ''}
  `
}

function renderPredictions(preds, horizon) {
  const filtered = (preds || []).filter((p) => p.horizon === horizon)
  if (filtered.length === 0) {
    return `<p class="muted">Nenhum palpite de horizonte ${HORIZON_LABELS[horizon] || horizon} gerado ainda.</p>`
  }

  const byClass = {}
  const order = []
  for (const p of filtered) {
    const cls = p.instruments?.asset_class || 'outros'
    if (!byClass[cls]) { byClass[cls] = []; order.push(cls) }
    byClass[cls].push(p)
  }

  const TOP_N = 3

  return order.map(cls => {
    const items = byClass[cls]
    const visible = items.slice(0, TOP_N)
    const rest = items.slice(TOP_N)
    return `
      <div class="class-group">
        <div class="class-title">${ASSET_CLASS_LABELS[cls] || cls} (${items.length})</div>
        ${visible.map(renderPredictionRow).join('')}
        ${rest.length > 0 ? `
          <details class="pred-more">
            <summary>ver mais ${rest.length}</summary>
            ${rest.map(renderPredictionRow).join('')}
          </details>
        ` : ''}
      </div>
    `
  }).join('')
}

function renderEntrySignals(preds, veredictos, fluxos) {
  const caveat = `<p class="signal-caveat">⚠ Acurácia direcional ainda não está provada com histórico suficiente — trate como apoio à decisão, não como sinal automático pra dinheiro real.</p>`

  const activeVeredictos = (veredictos || []).filter((v) => v.decisao !== 'fora')
  const activeFluxos = (fluxos || []).filter((f) => f.status !== 'neutro')
  const topPalpites = (preds || [])
    .filter((p) => p.horizon === '1D' && p.direction !== 'lateral')
    .sort((a, b) => Number(b.confidence_pct) - Number(a.confidence_pct))
    .slice(0, 8)

  const hasAnything = activeVeredictos.length > 0 || activeFluxos.length > 0 || topPalpites.length > 0
  if (!hasAnything) {
    return `${caveat}<p class="muted">Nenhum sinal de entrada/saída ativo hoje — veredicto e fluxo neutros, sem palpite direcional forte.</p>`
  }

  const parts = [caveat]

  if (activeVeredictos.length > 0) {
    parts.push(`<div class="signal-group-label">Veredicto por mercado</div>`)
    parts.push(
      activeVeredictos
        .map(
          (v) => `
      <div class="signal-chip-row">
        <span class="veredito-decisao ${v.decisao}">${v.decisao}</span>
        <span>${MERCADO_LABELS[v.mercado] || v.mercado}</span>
      </div>
    `
        )
        .join('')
    )
  }

  if (activeFluxos.length > 0) {
    parts.push(`<div class="signal-group-label" style="margin-top:0.85rem">Fluxo por classe</div>`)
    parts.push(
      activeFluxos
        .map(
          (f) => `
      <div class="signal-chip-row">
        <span class="fluxo-status ${f.status}">${f.status}</span>
        <span>${ASSET_CLASS_LABELS[f.asset_class] || f.asset_class}</span>
      </div>
    `
        )
        .join('')
    )
  }

  if (topPalpites.length > 0) {
    parts.push(`<div class="signal-group-label" style="margin-top:0.85rem">Palpites de maior convicção (1 dia)</div>`)
    parts.push(
      topPalpites
        .map((p) => {
          const sym = escapeHtml(p.instruments?.symbol_internal || '?')
          const dir = directionClass(p.direction)
          return `
        <div class="signal-row">
          <span class="pred-symbol">${sym}</span>
          <span class="pred-dir ${dir}">${directionArrow(p.direction)}</span>
          <span class="pred-conf">${p.confidence_pct}%</span>
        </div>
      `
        })
        .join('')
    )
  }

  return parts.join('')
}

function renderVeredito(veredictos) {
  if (!veredictos || veredictos.length === 0) return `<p class="muted">Veredicto ainda não gerado hoje.</p>`
  const order = ['eua', 'brasil', 'europa']
  const sorted = [...veredictos].sort((a, b) => order.indexOf(a.mercado) - order.indexOf(b.mercado))

    .map(
      (v) => `
    <div class="veredito-block">
      <div class="veredito-row">
        <span class="veredito-mercado">${MERCADO_LABELS[v.mercado] || v.mercado}</span>
        <span class="veredito-decisao ${v.decisao}">${v.decisao}</span>
      </div>
      <p class="veredito-razao">${escapeHtml(v.razao)}</p>
      ${v.invalidation_note ? `<p class="veredito-razao" style="color:var(--neutral);margin-top:0.3rem">⚡ Mudaria se: ${escapeHtml(v.invalidation_note)}</p>` : ''}
    </div>
  `

    .join('')

function renderCenarios(cenarios) {
  if (!cenarios || cenarios.length === 0) return `<p class="muted">Cenários ainda não gerados hoje.</p>`
  const order = ['expansao', 'base', 'estresse']
  const sorted = [...cenarios].sort((a, b) => order.indexOf(a.tipo) - order.indexOf(b.tipo))
  return sorted
    .map(
      (c) => `
    <div class="cenario-block">
      <span class="cenario-tipo ${c.tipo}">${CENARIO_LABELS[c.tipo] || c.tipo}</span>
      <p class="cenario-condicao"><strong>Se:</strong> ${escapeHtml(c.condicao)}</p>
      <p class="cenario-efeito"><strong>Então:</strong> ${escapeHtml(c.efeito_esperado)}</p>
    </div>
  `
    )
    .join('')
}

function renderFluxo(fluxos) {
  if (!fluxos || fluxos.length === 0) return `<p class="muted">Fluxo por classe ainda não gerado hoje.</p>`
  return fluxos
    .map(
      (f) => `
    <div class="fluxo-row">
      <div>
        <div>${ASSET_CLASS_LABELS[f.asset_class] || f.asset_class}</div>
        <div class="fluxo-motivo">${escapeHtml(f.motivo)}</div>
      </div>
      <span class="fluxo-status ${f.status}">${f.status}</span>
    </div>
  `
    )
    .join('')
}

function renderSynthesis(conc) {
  if (!conc) return `<p class="muted">Síntese ainda não gerada hoje.</p>`

  const alertas = Array.isArray(conc.sinais_alerta) ? conc.sinais_alerta : []
  const precisa = Array.isArray(conc.o_que_mercado_precisa) ? conc.o_que_mercado_precisa : []
  const temEstruturado = conc.driver_do_dia || conc.narrativa_dominante || alertas.length > 0 || precisa.length > 0

  // Fallback pra dias gravados antes da reestruturação (só tinham "texto")
  if (!temEstruturado && conc.texto) {
    const paragraphs = conc.texto.split('\n').filter(p => p.trim()).map(p => `<p>${escapeHtml(p)}</p>`).join('')
    return `<div class="prose">${paragraphs}</div>`
  }

  const blocks = []

  if (conc.driver_do_dia) {
    blocks.push(`
      <div class="synth-block">
        <div class="synth-label">Driver do dia</div>
        <p class="prose-p">${escapeHtml(conc.driver_do_dia)}</p>
      </div>
    `)
  }

  if (conc.narrativa_dominante) {
    blocks.push(`
      <div class="synth-block">
        <div class="synth-label">Narrativa dominante</div>
        <p class="prose-p">${escapeHtml(conc.narrativa_dominante)}</p>
      </div>
    `)
  }

  if (alertas.length > 0) {
    blocks.push(`
      <div class="synth-block alert">
        <div class="synth-label">⚠ Sinais de alerta</div>
        <ul class="synth-list">${alertas.map((a) => `<li>${escapeHtml(a)}</li>`).join('')}</ul>
      </div>
    `)
  }

  if (precisa.length > 0) {
    blocks.push(`
      <div class="synth-block">
        <div class="synth-label">O que o mercado precisa</div>
        <ul class="synth-list">${precisa.map((p) => `<li>${escapeHtml(p)}</li>`).join('')}</ul>
      </div>
    `)
  }

  return blocks.join('') || `<p class="muted">Síntese ainda não gerada hoje.</p>`
}

async function renderInProgress(horizon, latestBySymbol) {
  const el = document.getElementById(`progress-${horizon}`)
  if (!el) return

  const { data: allPreds } = await sb
    .from('predictions')
    .select('id, instrument_id, market_date, target_date, direction, magnitude_min_pct, magnitude_max_pct, confidence_pct, reference_price, instruments(symbol_internal,name)')
    .eq('horizon', horizon)
    .order('market_date', { ascending: false })
    .limit(200)

  if (!allPreds || allPreds.length === 0) {
    el.innerHTML = `<p class="muted">Nenhum palpite de ${horizon === '1W' ? '1 semana' : '1 mês'} ainda.</p>`
    return
  }

  const ids = allPreds.map((p) => p.id)
  const { data: resolved } = await sb.from('prediction_resolutions').select('prediction_id').in('prediction_id', ids)
  const resolvedIds = new Set((resolved || []).map((r) => r.prediction_id))
  const pending = allPreds.filter((p) => !resolvedIds.has(p.id))

  const latestByInstrument = {}
  for (const p of pending) {
    const key = p.instrument_id
    if (!latestByInstrument[key] || p.market_date > latestByInstrument[key].market_date) latestByInstrument[key] = p
  }

  const items = Object.values(latestByInstrument).sort((a, b) => Number(b.confidence_pct) - Number(a.confidence_pct))

  if (items.length === 0) {
    el.innerHTML = `<p class="muted">Nenhum palpite pendente de ${horizon === '1W' ? '1 semana' : '1 mês'}.</p>`
    return
  }

  el.innerHTML = items
    .map((p) => {
      const sym = p.instruments?.symbol_internal || '?'
      const name = p.instruments?.name || ''
      const current = latestBySymbol[sym]?.close

      if (current == null || p.reference_price == null) {
        return `<div class="progress-row"><span class="progress-symbol">${escapeHtml(sym)}</span><span class="muted">sem dado atual</span></div>`
      }

      const actualPct = ((current - p.reference_price) / p.reference_price) * 100
      const absActual = Math.abs(actualPct)
      const hasMag = p.magnitude_min_pct != null && p.magnitude_max_pct != null
      const absHi = hasMag ? Math.max(Math.abs(p.magnitude_min_pct), Math.abs(p.magnitude_max_pct)) : null

      const onTrack =
        p.direction === 'lateral' ? absActual <= (absHi ?? Infinity) : p.direction === 'alta' ? actualPct > 0 : actualPct < 0

      const progressPct = absHi ? Math.min(100, (absActual / absHi) * 100) : null
      const dirClass = directionClass(p.direction)
      const barClass = p.direction === 'lateral' ? 'misto' : p.direction === 'alta' ? 'positivo' : 'negativo'

      return `
      <div class="progress-row">
        <div class="progress-top">
          <span class="progress-symbol">${escapeHtml(sym)}<span class="pred-name">${escapeHtml(name)}</span></span>
          <span class="progress-status ${onTrack ? 'ok' : 'off'}">${onTrack ? 'no caminho' : 'fora do previsto'}</span>
        </div>
        <div class="progress-detail">
          previsto <span class="pred-dir ${dirClass}">${directionArrow(p.direction)}</span>
          ${hasMag ? `${p.magnitude_min_pct}% a ${p.magnitude_max_pct}%` : ''} (conv. ${p.confidence_pct}%) · até ${fmtDate(p.target_date)}
        </div>
        <div class="progress-detail">hoje: ${actualPct > 0 ? '+' : ''}${actualPct.toFixed(2)}% desde ${fmtDate(p.market_date)}</div>
        ${progressPct != null ? `<div class="driver-bar-track"><div class="driver-bar-fill ${barClass}" style="width:${progressPct}%"></div></div>` : ''}
      </div>
    `
    })
    .join('')
}

async function renderCalendar() {
  const el = document.getElementById('calendar')
  if (!el) return

  const [{ data: macro }, { data: radarMacro }] = await Promise.all([
    sb
      .from('macro_dados')
      .select('release_date,indicator_name,result,consensus,vs_consensus,impact')
      .order('release_date', { ascending: false })
      .limit(15),
    sb
      .from('radar_eventos')
      .select('expected_date,expected_time,description,importance,impact_note')
      .eq('theme', 'macro')
      .order('expected_date', { ascending: false })
      .limit(15),
  ])

  const items = []
  for (const m of macro || []) {
    items.push({
      date: m.release_date,
      time: null,
      isPast: true,
      title: m.indicator_name,
      detail: `${m.result ?? ''}${m.consensus ? ' · consenso: ' + m.consensus : ''}`,
      tag: VS_CONSENSUS_LABELS[m.vs_consensus] || m.vs_consensus,
      note: m.impact,
    })
  }
  for (const r of radarMacro || []) {
    items.push({
      date: r.expected_date,
      time: r.expected_time,
      isPast: false,
      title: r.description,
      detail: '',
      tag: r.importance,
      note: r.impact_note,
    })
  }

  if (items.length === 0) {
    el.innerHTML = `<p class="muted">Nenhum dado no calendário ainda.</p>`
    return
  }

  items.sort((a, b) => (b.date || '').localeCompare(a.date || ''))

  el.innerHTML = items
    .map((it) => {
      const stateClass = it.isPast ? 'cal-past' : 'cal-future'
      const whenText = it.date ? `${fmtDate(it.date)}${it.time ? ' · ' + escapeHtml(it.time) : ''}` : 'data incerta'
      return `
    <div class="item ${stateClass}">
      <span class="tag ${it.isPast ? 'cal-tag-past' : 'cal-tag-future'}">${it.isPast ? '✓' : '○'} ${escapeHtml(it.tag || '')}</span>
      <span class="when">${whenText}</span>
      <p class="headline">${escapeHtml(it.title)}</p>
      ${it.detail ? `<p class="summary">${escapeHtml(it.detail)}</p>` : ''}
      ${it.note ? `<p class="calendar-impact">${it.isPast ? '📊' : '🔮'} ${escapeHtml(it.note)}</p>` : ''}
    </div>
  `
    })
    .join('')
}

async function renderConfig() {
  const el = document.getElementById('config-panel')
  if (!el) return

  const [{ data: config }, { data: thresholds }] = await Promise.all([
    sb.from('config').select('key, description, value').order('key'),
    sb.from('resolution_thresholds').select('asset_class, horizon, alta_min_pct, baixa_max_pct').order('asset_class').order('horizon'),
  ])

  // Parâmetros que AINDA vivem só no código das Edge Functions — não são
  // consultados do banco (não dá pra buscar isso ao vivo), então essa
  // lista é fixa aqui e precisa ser atualizada manualmente se o código
  // mudar. Só existe pra você lembrar que eles existem e pedir ajuste.
  const codeLocked = [
    { key: 'Modelo de síntese (generate-synthesis, weekly/monthly)', value: 'claude-sonnet-5, effort alto' },
    { key: 'Nº de cenários gerados', value: 'sempre 3 (expansão/base/estresse)' },
    { key: 'Nº de vereditos gerados', value: 'sempre 3 (brasil/eua/europa)' },
    { key: 'Nº de drivers (barra de influência)', value: 'entre 4 e 8' },
    { key: 'Modelo de notícias/radar/macro', value: 'sonar-pro (Perplexity)' },
    { key: 'Retry Claude API', value: 'até 3 tentativas, espera 3s/6s' },
    { key: 'Retry Perplexity API', value: 'até 3 tentativas, espera 5s/10s' },
    { key: 'Horários do cron (11 jobs)', value: '22h00 às 22h27 BRT, seg-sex' },
  ]

  let html = `
    <p class="muted" style="margin-bottom:1rem">
      🟢 abaixo = já editável (UPDATE direto na tabela) · 🔴 = ainda fixo no código, precisa pedir ajuste
    </p>
  `

  if (config && config.length > 0) {
    html += `<div class="config-group"><div class="class-title">🟢 Regime (compute-regime)</div>`
    html += config
      .map(
        (c) => `
      <div class="config-row">
        <div>
          <div class="config-key">${escapeHtml(c.key)}</div>
          <div class="config-desc">${escapeHtml(c.description)}</div>
        </div>
        <span class="config-value">${c.value}</span>
      </div>
    `
      )
      .join('')
    html += `</div>`
  }

  if (thresholds && thresholds.length > 0) {
    html += `<div class="config-group"><div class="class-title">🟢 Thresholds de resolução (resolve-predictions)</div>`
    html += thresholds
      .map(
        (t) => `
      <div class="config-row">
        <span class="config-key">${escapeHtml(t.asset_class)} · ${escapeHtml(t.horizon)}</span>
        <span class="config-value">${t.baixa_max_pct}% a +${t.alta_min_pct}%</span>
      </div>
    `
      )
      .join('')
    html += `</div>`
  }

  html += `<div class="config-group"><div class="class-title">🔴 Ainda fixo no código</div>`
  html += codeLocked
    .map(
      (c) => `
    <div class="config-row">
      <span class="config-key">${escapeHtml(c.key)}</span>
      <span class="config-value muted-value">${escapeHtml(c.value)}</span>
    </div>
  `
    )
    .join('')
  html += `</div>`

  el.innerHTML = html
}

async function renderTrackRecord() {
  const { data, error } = await sb
    .from('prediction_resolutions')
    .select('direction_correct, direction_actual, predictions(confidence_pct)')
  const el = document.getElementById('track-record')
  if (error || !data || data.length === 0) {
    el.innerHTML = `<p class="muted">Ainda sem histórico de acurácia — o primeiro resultado aparece assim que os palpites de hoje forem resolvidos, comparando com o fechamento do dia seguinte.</p>`
    return
  }
  const total = data.length
  const acertos = data.filter((r) => r.direction_correct).length
  const pct = ((acertos / total) * 100).toFixed(0)
  const lateralCount = data.filter((r) => r.direction_actual === 'lateral').length
  const baselinePct = ((lateralCount / total) * 100).toFixed(0)

  // Gap de calibração: convicção média declarada vs. acerto real. Se a
  // convicção média bate perto do acerto real, o sistema está calibrado
  // (sabe quando está incerto). Se a convicção é sempre alta mas o
  // acerto não acompanha, é excesso de confiança.
  const withConf = data.filter((r) => r.predictions?.confidence_pct != null)
  const avgConf =
    withConf.length > 0 ? withConf.reduce((s, r) => s + Number(r.predictions.confidence_pct), 0) / withConf.length : null
  const correctConf = withConf.filter((r) => r.direction_correct)
  const wrongConf = withConf.filter((r) => !r.direction_correct)
  const avgConfCorrect =
    correctConf.length > 0 ? correctConf.reduce((s, r) => s + Number(r.predictions.confidence_pct), 0) / correctConf.length : null
  const avgConfWrong =
    wrongConf.length > 0 ? wrongConf.reduce((s, r) => s + Number(r.predictions.confidence_pct), 0) / wrongConf.length : null

  const calibrationHtml =
    avgConf != null
      ? `
    <p class="muted" style="margin-top:0.5rem">Convicção média declarada: ${avgConf.toFixed(0)}% · gap vs. acerto real: ${(avgConf - Number(pct)).toFixed(0)}pp</p>
    ${avgConfCorrect != null && avgConfWrong != null ? `<p class="muted" style="margin-top:0.2rem">Convicção quando acertou: ${avgConfCorrect.toFixed(0)}% · quando errou: ${avgConfWrong.toFixed(0)}%</p>` : ''}
  `
      : ''

  el.innerHTML = `
    <div class="stat-big">${pct}%</div>
    <p class="muted">${acertos} de ${total} palpites resolvidos, acerto de direção</p>
    <p class="muted" style="margin-top:0.5rem">Baseline "sempre lateral": ${baselinePct}%</p>
    ${calibrationHtml}
  `
}

async function renderTraceability() {
  const el = document.getElementById('traceability')
  if (!el) return

  const { data } = await sb
    .from('prediction_resolutions')
    .select('direction_correct, actual_return_pct, predictions(direction, market_date, instruments(symbol_internal))')
    .order('id', { ascending: false })
    .limit(60)

  if (!data || data.length === 0) {
    el.innerHTML = `<p class="muted">Nenhum palpite resolvido ainda.</p>`
    return
  }

  const latestIssueDate = data.reduce((max, r) => {
    const d = r.predictions?.market_date
    return !max || (d && d > max) ? d : max
  }, null)

  const batch = data.filter((r) => r.predictions?.market_date === latestIssueDate)
  const acertos = batch.filter((r) => r.direction_correct).length

  const summaryEl = document.getElementById('traceability-summary')
  if (summaryEl) summaryEl.textContent = `Rastreabilidade por ativo (${batch.length})`

  el.innerHTML = `
    <p class="muted" style="margin-bottom:0.75rem">Palpites emitidos em ${fmtDate(latestIssueDate)} — ${acertos}/${batch.length} corretos:</p>
    ${batch
      .map((r) => {
        const sym = escapeHtml(r.predictions?.instruments?.symbol_internal || '?')
        const mark = r.direction_correct ? '✅' : '❌'
        const ret =
          r.actual_return_pct != null
            ? `${Number(r.actual_return_pct) > 0 ? '+' : ''}${Number(r.actual_return_pct).toFixed(2)}%`
            : ''
        return `<div class="trace-row"><span>${mark} ${sym}</span><span class="muted">${escapeHtml(r.predictions?.direction ?? '')} → ${ret}</span></div>`
      })
      .join('')}
  `
}

function renderSnapshot(instruments, latestBySymbol) {
  const byClass = {}
  for (const inst of instruments) {
    if (!inst.is_analyzed) continue
    const cls = inst.asset_class
    if (!byClass[cls]) byClass[cls] = []
    byClass[cls].push(inst)
  }

  return Object.entries(byClass).map(([cls, insts]) => {
    const rows = insts.map(inst => {
      const symbol = escapeHtml(inst.symbol_internal)
      const name = escapeHtml(inst.name || '')
      const md = latestBySymbol[inst.symbol_internal]
      if (!md) return `<div class="snap-row"><span>${symbol}<span class="snap-name">${name}</span></span><span class="muted">sem dado</span></div>`
      const chgClass = md.change_pct > 0 ? 'up' : md.change_pct < 0 ? 'down' : 'flat'
      const chgTxt = md.change_pct != null ? `${md.change_pct > 0 ? '+' : ''}${md.change_pct}%` : '—'
      return `<div class="snap-row"><span>${symbol}<span class="snap-name">${name}</span></span><span class="snap-chg ${chgClass}">${chgTxt}</span></div>`
    }).join('')
    return `<div class="class-group"><div class="class-title">${ASSET_CLASS_LABELS[cls] || cls}</div>${rows}</div>`
  }).join('')
}

function renderNews(events) {
  if (!events || events.length === 0) return `<p class="muted">Nenhuma notícia registrada hoje.</p>`
  return events.map(e => `
    <div class="item">
      <span class="tag">${THEME_LABELS[e.theme] || e.theme}</span>
      ${e.impact_direction ? `<span class="tag">${escapeHtml(e.impact_direction)}</span>` : ''}
      <p class="headline">${escapeHtml(e.headline)}</p>
      <p class="summary">${escapeHtml(e.summary || '')}</p>
    </div>
  `).join('')
}

function renderRadar(radar) {
  if (!radar || radar.length === 0) return `<p class="muted">Nenhum evento no radar.</p>`
  return radar.map(r => `
    <div class="item">
      <span class="tag">${THEME_LABELS[r.theme] || r.theme}</span>
      <span class="tag">${escapeHtml(r.importance)}</span>
      <span class="when">${r.expected_date ? fmtDate(r.expected_date) : 'data incerta'}</span>
      <p class="summary" style="margin-top:0.3rem">${escapeHtml(r.description)}</p>
    </div>
  `).join('')
}

const VS_CONSENSUS_LABELS = { acima: 'Acima', abaixo: 'Abaixo', em_linha: 'Em linha', sem_consenso: 'Sem consenso' }
const TENDENCIA_LABELS = { crescendo: '↑ crescendo', estavel: '→ estável', diminuindo: '↓ diminuindo' }

function renderDrivers(drivers) {
  if (!drivers || drivers.length === 0) return `<p class="muted">Barra de influência ainda não gerada hoje.</p>`
  const sorted = [...drivers].sort((a, b) => Number(b.forca) - Number(a.forca))
  return sorted.map(d => `
    <div class="driver-row">
      <div class="driver-top">
        <span class="driver-nome">${escapeHtml(d.nome)}</span>
        <span class="driver-tendencia">${TENDENCIA_LABELS[d.tendencia] || d.tendencia}</span>
      </div>
      <div class="driver-tema">${escapeHtml(d.tema || '')} · força ${Number(d.forca).toFixed(0)}/10</div>
      <div class="driver-bar-track"><div class="driver-bar-fill ${d.direcao}" style="width:${Number(d.forca) * 10}%"></div></div>
      <p class="driver-next">${escapeHtml(d.proximo_passo)}</p>
    </div>
  `).join('')
}

async function loadDashboard(forcedDate) {
  const app = document.getElementById('app')
  try {
    const { data: allDaysData } = await sb
      .from('conclusao_operacional')
      .select('market_date')
      .order('market_date', { ascending: false })
      .limit(30)

    const availableDays = (allDaysData || []).map((d) => d.market_date)
    const marketDate = forcedDate || availableDays[0]

    if (!marketDate) {
      app.innerHTML = `<div class="error">Nenhum dia completo ainda. O pipeline roda todo dia útil às 22h BRT — volte depois da primeira execução completa.</div>`
      return
    }

    const [instrumentsRes, marketDataRes, regimeRes, fgRes, concRes, predsRes, eventsRes, radarRes, cenariosRes, veredictoRes, fluxoRes, driversRes, runStatusRes] = await Promise.all([
      sb.from('instruments').select('symbol_internal,name,asset_class,is_analyzed').eq('active', true),
      sb.from('market_data').select('close,change_pct,market_date,instruments(symbol_internal)').order('market_date', { ascending: false }),
      sb.from('regime_diario').select('*').eq('market_date', marketDate),
      sb.from('fear_greed').select('*, fear_greed_components(*)').eq('market_date', marketDate).maybeSingle(),
      sb.from('conclusao_operacional').select('texto,driver_do_dia,narrativa_dominante,sinais_alerta,o_que_mercado_precisa').eq('market_date', marketDate).maybeSingle(),
      sb.from('predictions').select('*,instruments(symbol_internal,name,asset_class)').eq('market_date', marketDate).order('confidence_pct', { ascending: false }),
      sb.from('events').select('*').eq('market_date', marketDate),
      sb.from('radar_eventos').select('*').eq('market_date', marketDate).neq('theme', 'macro').order('expected_date', { ascending: true, nullsFirst: false }),
      sb.from('cenarios').select('tipo,condicao,efeito_esperado').eq('market_date', marketDate),
      sb.from('veredito_operacional').select('mercado,decisao,razao,invalidation_note').eq('market_date', marketDate),
      sb.from('fluxo_por_classe').select('asset_class,status,motivo').eq('market_date', marketDate),
      sb.from('drivers').select('nome,tema,direcao,forca,tendencia,proximo_passo').eq('market_date', marketDate),
      sb.from('analysis_runs').select('status,notes').eq('market_date', marketDate).maybeSingle(),
    ])

    const latestBySymbol = {}
    for (const row of marketDataRes.data || []) {
      const sym = row.instruments?.symbol_internal
      if (!sym || latestBySymbol[sym]) continue
      latestBySymbol[sym] = row
    }

    allPredictions = predsRes.data || []
    currentHorizon = '1D'

    const loadedAt = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    const isStale = marketDate !== todayBRTClient()
    const staleNote = isStale
      ? forcedDate
        ? `<div class="stale-note">Visualizando ${fmtDate(marketDate)} (dia anterior, escolhido no seletor)</div>`
        : `<div class="stale-note">Mostrando o último dia completo (${fmtDate(marketDate)}) — hoje ainda está em andamento</div>`
      : ''

    const runStatus = runStatusRes.data?.status
    let healthDotClass = 'muted'
    let healthDotTitle = 'Status do pipeline desconhecido'
    let healthLabel = '—'
    let healthBanner = ''
    if (runStatus === 'success') {
      healthDotClass = 'ok'
      healthDotTitle = 'Pipeline completo'
      healthLabel = 'completo'
    } else if (runStatus === 'partial') {
      healthDotClass = 'warn'
      healthDotTitle = 'Pipeline incompleto'
      healthLabel = 'incompleto'
      healthBanner = `<div class="health-banner warn">⚠ Pipeline incompleto — ${escapeHtml(runStatusRes.data?.notes || '')}</div>`
    } else if (runStatus === 'failed') {
      healthDotClass = 'error'
      healthDotTitle = 'Pipeline falhou'
      healthLabel = 'falhou'
      healthBanner = `<div class="health-banner error">✗ Pipeline falhou — ${escapeHtml(runStatusRes.data?.notes || '')}</div>`
    } else if (runStatus === 'running') {
      healthDotClass = 'muted'
      healthDotTitle = 'Pipeline ainda em andamento hoje'
      healthLabel = 'em andamento'
    }

    const daySelectorHtml = availableDays.length > 1
      ? `<select class="day-selector" id="day-selector">
          ${availableDays.map((d) => `<option value="${d}" ${d === marketDate ? 'selected' : ''}>${fmtDate(d)}</option>`).join('')}
        </select>`
      : ''

    app.innerHTML = `
      <header class="top">
        <h1>SISTEMA DE MERCADO</h1>
        <div class="header-right">
          ${daySelectorHtml}
          <span class="date">${fmtDate(marketDate)}</span>
          <span class="updated-badge"><span class="health-dot ${healthDotClass}" title="${healthDotTitle}"></span>pipeline ${healthLabel} · ${loadedAt}</span>
          <button class="refresh-btn" id="refresh-btn">↻ atualizar</button>
        </div>
      </header>

      ${healthBanner}
      ${staleNote}

      <div class="dashboard-grid">
        <div class="col-side">
          <div>
            ${renderGauge(regimeRes.data)}
            ${renderFearGreed(fgRes.data)}
            ${renderHighlights(latestBySymbol, instrumentsRes.data || [])}
          </div>
          <div>
            <p class="eyebrow">Track record</p>
            <div class="card" id="track-record"><p class="muted">carregando…</p></div>
          </div>
        </div>

        <div class="col-main">
          <section style="margin-top:0">
            <p class="eyebrow">Sinais de entrada</p>
            <div class="card">${renderEntrySignals(predsRes.data, veredictoRes.data, fluxoRes.data)}</div>
          </section>

          <details class="section-collapse" open>
            <summary>Palpites (${(predsRes.data || []).length})</summary>
            <div class="horizon-tabs">
              <button class="horizon-btn active" data-horizon="1D" onclick="switchHorizon('1D')">1 dia</button>
              <button class="horizon-btn" data-horizon="1W" onclick="switchHorizon('1W')">1 semana</button>
              <button class="horizon-btn" data-horizon="1M" onclick="switchHorizon('1M')">1 mês</button>
            </div>
            <div class="card" id="predictions-container">${renderPredictions(predsRes.data, '1D')}</div>
          </details>

          <section>
            <p class="eyebrow">Conclusão operacional</p>
            <div class="card">${renderSynthesis(concRes.data)}</div>
          </section>

          <section>
            <p class="eyebrow">Barra de influência</p>
            <div class="card">${renderDrivers(driversRes.data)}</div>
          </section>

          <section>
            <p class="eyebrow">Veredicto operacional</p>
            <div class="card">${renderVeredito(veredictoRes.data)}</div>
          </section>

          <section>
            <p class="eyebrow">Cenários</p>
            <div class="card">${renderCenarios(cenariosRes.data)}</div>
          </section>
        </div>
      </div>

      <div class="below-grid">
        <details class="section-collapse">
          <summary id="traceability-summary">Rastreabilidade por ativo</summary>
          <div class="card" id="traceability"><p class="muted">carregando…</p></div>
        </details>

        <details class="section-collapse" style="margin-top:1rem" open>
          <summary>Semana em andamento</summary>
          <div class="card" id="progress-1W"><p class="muted">carregando…</p></div>
        </details>

        <details class="section-collapse" style="margin-top:1rem">
          <summary>Mês em andamento</summary>
          <div class="card" id="progress-1M"><p class="muted">carregando…</p></div>
        </details>

        <details class="section-collapse" style="margin-top:1rem">
          <summary>Notícias de hoje (${(eventsRes.data || []).length})</summary>
          <div class="card">${renderNews(eventsRes.data)}</div>
        </details>

        <details class="section-collapse" style="margin-top:1rem">
          <summary>Radar — próximos dias (${(radarRes.data || []).length})</summary>
          <div class="card">${renderRadar(radarRes.data)}</div>
        </details>

        <details class="section-collapse" style="margin-top:1rem">
          <summary>Calendário econômico</summary>
          <div class="card" id="calendar"><p class="muted">carregando…</p></div>
        </details>

        <details class="section-collapse" style="margin-top:1rem">
          <summary>Fluxo por classe</summary>
          <div class="card">${renderFluxo(fluxoRes.data)}</div>
        </details>

        <details class="section-collapse" style="margin-top:1rem">
          <summary>Snapshot completo por classe</summary>
          <div class="card">${renderSnapshot(instrumentsRes.data || [], latestBySymbol)}</div>
        </details>

        <details class="section-collapse" style="margin-top:1rem">
          <summary>Configurações do sistema</summary>
          <div class="card" id="config-panel"><p class="muted">carregando…</p></div>
        </details>
      </div>

      <footer class="foot">dados via Supabase · Sistema de Mercado</footer>
    `

    renderTrackRecord()
    renderTraceability()
    renderInProgress('1W', latestBySymbol)
    renderInProgress('1M', latestBySymbol)
    renderCalendar()
    renderConfig()

    const btn = document.getElementById('refresh-btn')
    if (btn) {
      btn.addEventListener('click', () => {
        btn.disabled = true
        btn.textContent = '↻ atualizando…'
        loadDashboard()
      })
    }

    const daySelect = document.getElementById('day-selector')
    if (daySelect) {
      daySelect.addEventListener('change', (e) => {
        loadDashboard(e.target.value)
      })
    }
  } catch (err) {
    console.error(err)
    app.innerHTML = `<div class="error">Erro ao carregar: ${err.message}</div>`
  }
}

loadDashboard()
</script>
