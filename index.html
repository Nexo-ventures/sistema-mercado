    { count: newsCount },
    { count: radarCount },
    { data: fgToday },
    { count: driversCount },
    { data: cenariosToday },
  ] = await Promise.all([
    sb.from('config').select('key, description, value').order('key'),
    sb.from('resolution_thresholds').select('asset_class, horizon, alta_min_pct, baixa_max_pct').order('asset_class').order('horizon'),
    sb.from('instruments').select('*', { count: 'exact', head: true }),
    sb.from('market_data').select('instrument_id').eq('market_date', marketDate),
    sb.from('macro_dados').select('indicator_name,pais,release_date').order('release_date', { ascending: false, nullsFirst: false }).limit(50),
    sb.from('events').select('*', { count: 'exact', head: true }).eq('market_date', marketDate),
    sb.from('radar_eventos').select('*', { count: 'exact', head: true }).eq('market_date', marketDate),
    sb.from('fear_greed').select('market_date').eq('market_date', marketDate),
    sb.from('drivers').select('*', { count: 'exact', head: true }).eq('market_date', marketDate),
    sb.from('cenarios').select('probabilidade').eq('market_date', marketDate),
  ])

  // Modelos e fontes — informação que já existia solta dentro de
  // "fixo no código", mas merece destaque próprio (transparência de
  // onde vem cada camada do sistema).
  const modelos = [
    { key: 'Síntese, análise, cenários e palpites', value: 'Claude Sonnet 5 (effort alto)' },
    { key: 'Notícias, Radar e Macro', value: 'Perplexity Sonar Pro' },
  ]
  const fontes = [
    { key: 'Preço de mercado', value: 'Yahoo Finance' },
    { key: 'Yields / juros', value: 'FRED' },
    { key: 'Fear & Greed', value: 'CNN' },
    { key: 'Notícias, Radar e Macro', value: 'Perplexity (busca web)' },
    { key: 'Banco de dados', value: 'Supabase' },
  ]

  // Parâmetros que AINDA vivem só no código das Edge Functions — não são
  // consultados do banco (não dá pra buscar isso ao vivo), então essa
  // lista é fixa aqui e precisa ser atualizada manualmente se o código
  // mudar. Só existe pra você lembrar que eles existem e pedir ajuste.
  // Escondida por padrão — é detalhe de implementação, não o que mais
  // importa bater o olho primeiro.
  const codeLocked = [
    { key: 'Nº de cenários gerados', value: 'sempre 3 (expansão/base/estresse)' },
    { key: 'Nº de vereditos gerados', value: 'sempre 3 (brasil/eua/europa)' },
    { key: 'Nº de drivers (barra de influência)', value: 'entre 4 e 8' },
    { key: 'Retry Claude API', value: 'até 3 tentativas, espera 3s/6s' },
    { key: 'Retry Perplexity API', value: 'até 3 tentativas, espera 5s/10s' },
    { key: 'Horários do cron (11 jobs)', value: '22h00 às 22h27 BRT, seg-sex' },
  ]

  // Qualidade dos dados do dia — a diferença entre "o modelo está
  // pessimista" e "o modelo está pessimista porque faltou 30% do
  // input" é enorme, e antes não dava pra saber olhando a tela.
  const marketDataCount = new Set((marketToday || []).map((m) => m.instrument_id)).size
  const macroMatched = MACRO_CHECKLIST.filter((ci) =>
    (macroRecent || []).some((m) => (m.pais || guessCountryFromText(m.indicator_name)) === ci.pais && matchesKeyword(m.indicator_name, ci.keywords, ci.contextKeywords))
  ).length
  const cenariosCount = (cenariosToday || []).length
  const cenariosSum = (cenariosToday || []).reduce((s, c) => s + Number(c.probabilidade || 0), 0)
  const fgOk = fgToday && fgToday.length > 0

  const qualStatus = (ok) => (ok ? '✅' : '⚠')
  const qualidadeHtml = `
    <div class="config-group">
      <div class="class-title">📊 Qualidade dos dados — ${fmtDate(marketDate)}</div>
      <div class="config-row"><span class="config-key">Preço de mercado</span><span class="config-value">${marketDataCount}${totalInstruments ? '/' + totalInstruments : ''} ativos ${qualStatus(totalInstruments ? marketDataCount >= totalInstruments : marketDataCount > 0)}</span></div>
      <div class="config-row"><span class="config-key">Macro</span><span class="config-value">${macroMatched}/${MACRO_CHECKLIST.length} categorias com dado ${qualStatus(macroMatched === MACRO_CHECKLIST.length)}</span></div>
      <div class="config-row"><span class="config-key">Notícias coletadas</span><span class="config-value">${newsCount ?? 0} ${qualStatus((newsCount ?? 0) > 0)}</span></div>
      <div class="config-row"><span class="config-key">Radar coletado</span><span class="config-value">${radarCount ?? 0} eventos ${qualStatus((radarCount ?? 0) > 0)}</span></div>
      <div class="config-row"><span class="config-key">Fear &amp; Greed</span><span class="config-value">${fgOk ? 'atualizado ✅' : 'não atualizado ⚠'}</span></div>
      <div class="config-row"><span class="config-key">Drivers gerados</span><span class="config-value">${driversCount ?? 0} ${qualStatus((driversCount ?? 0) > 0)}</span></div>
      <div class="config-row"><span class="config-key">Cenários</span><span class="config-value">${cenariosCount}/3 ${qualStatus(cenariosCount === 3 && cenariosSum >= 85 && cenariosSum <= 115)}${cenariosCount === 3 ? ` · soma ${cenariosSum.toFixed(0)}%` : ''}</span></div>
    </div>
  `

  let html = qualidadeHtml + `
    <p class="muted" style="margin-bottom:1rem">
      🟢 abaixo = já editável (UPDATE direto na tabela) · 🔒 = ainda fixo no código, precisa pedir ajuste
    </p>
  `

  html += `<div class="config-group"><div class="class-title">🤖 Modelos</div>`
  html += modelos
    .map((c) => `<div class="config-row"><span class="config-key">${escapeHtml(c.key)}</span><span class="config-value muted-value">${escapeHtml(c.value)}</span></div>`)
    .join('')
  html += `</div>`

  html += `<div class="config-group"><div class="class-title">📡 Fontes de dado</div>`
  html += fontes
    .map((c) => `<div class="config-row"><span class="config-key">${escapeHtml(c.key)}</span><span class="config-value muted-value">${escapeHtml(c.value)}</span></div>`)
    .join('')
  html += `</div>`

  if (config && config.length > 0) {
    html += `<div class="config-group"><div class="class-title">🟢 Regime (compute-regime)</div>`
    html += config
      .map(
        (c) => `
      <div class="config-row">
        <div>
          <div class="config-key">${escapeHtml(c.key)}</div>
          <div class="config-desc">${escapeHtml(c.description)}</div>
        </div>
        <span class="config-value">${c.value}</span>
      </div>
    `
      )
      .join('')
    html += `</div>`
  }

  if (thresholds && thresholds.length > 0) {
    html += `<div class="config-group"><div class="class-title">🟢 Thresholds de resolução (resolve-predictions)</div>`
    html += thresholds
      .map((t) => {
        const baixa = Number(t.baixa_max_pct)
        const alta = Number(t.alta_min_pct)
        return `
      <div class="config-row" style="align-items:flex-start">
        <span class="config-key">${escapeHtml(t.asset_class)} · ${escapeHtml(t.horizon)}</span>
        <div style="text-align:right;font-size:0.78rem">
          <div>Baixa: ≤ ${baixa}%</div>
          <div class="muted">Lateral: ${baixa}% a +${alta}%</div>
          <div>Alta: ≥ +${alta}%</div>
        </div>
      </div>
    `
      })
      .join('')
    html += `</div>`
  }

  html += `
    <details class="pred-details" style="margin-top:0.5rem">
      <summary>▸ configurações avançadas (fixas no código)</summary>
      <div class="config-group" style="margin-top:0.5rem">
        ${codeLocked
          .map((c) => `<div class="config-row"><span class="config-key">${escapeHtml(c.key)}</span><span class="config-value muted-value">${escapeHtml(c.value)}</span></div>`)
          .join('')}
      </div>
    </details>
  `

  el.innerHTML = html
}

async function renderFearGreedDetail() {
  const el = document.getElementById('fg-detail')
  if (!el) return

  const { data: historyDesc } = await sb
    .from('fear_greed')
    .select('id, market_date, index_value, label, fear_greed_components(component, value, label)')
    .order('market_date', { ascending: false })
    .limit(30)
  const history = (historyDesc || []).slice().reverse()

  if (!history || history.length === 0) {
    el.innerHTML = `<p class="muted">Nenhum dado de Fear &amp; Greed ainda.</p>`
    return
  }

  const latest = history[history.length - 1]

  // Gráfico de tendência — só ocupa espaço quando existe de verdade
  // (a partir de 3 dias de histórico); antes disso vira 1 linha discreta
  // junto do resto do texto explicativo, no rodapé.
  let chartHtml = ''
  let notEnoughNote = ''
  if (history.length < 3) {
    notEnoughNote = `Gráfico de tendência aparece com mais dias acumulados (hoje: ${history.length} dia${history.length === 1 ? '' : 's'} de histórico).`
  } else {
    const bars = history
      .map((h) => {
        const val = Number(h.index_value)
        const heightPct = Math.max(4, val)
        const color = val >= 55 ? 'var(--risk-on-strong)' : val <= 45 ? 'var(--risk-off-strong)' : 'var(--text-faint)'
        const d = new Date(h.market_date + 'T12:00:00')
        const shortDate = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`
        return `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
          <span style="font-family:var(--font-mono);font-size:0.62rem;font-weight:700;color:${color};margin-bottom:3px;">${val.toFixed(0)}</span>
          <div style="width:60%;height:${heightPct}%;background:${color};border-radius:2px 2px 0 0;" title="${fmtDate(h.market_date)}: ${val.toFixed(0)}"></div>
        </div>
      `
      })
      .join('')
    const dateLabels = history
      .map((h) => {
        const d = new Date(h.market_date + 'T12:00:00')
        return `<span style="flex:1;text-align:center">${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}</span>`
      })
      .join('')
    chartHtml = `
      <div style="position:relative;height:70px;margin-top:1rem;">
        <div style="position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--border);"></div>
        <div style="display:flex;align-items:flex-end;height:100%;gap:3px;position:relative;">${bars}</div>
      </div>
      <div style="display:flex;font-size:0.6rem;color:var(--text-faint);font-family:var(--font-mono);margin-bottom:0.5rem;gap:3px;">${dateLabels}</div>
    `
  }

  const components = latest.fear_greed_components || []

  // Item 5: F&G 65 com todo mundo em ~65 é bem diferente de F&G 65
  // com metade em 95 e metade em 30 — a média sozinha esconde isso.
  let divergenceHtml = ''
  const compValues = components.map((c) => Number(c.value)).filter((v) => !isNaN(v))
  if (compValues.length >= 2) {
    const maxV = Math.max(...compValues)
    const minV = Math.min(...compValues)
    const spread = maxV - minV
    const aggregateSide = Number(latest.index_value) >= 50 ? 'greed' : 'fear'
    const aligned = components.filter((c) => {
      const v = Number(c.value)
      if (isNaN(v)) return false
      return (v >= 50 ? 'greed' : 'fear') === aggregateSide
    }).length
    if (spread >= 40) {
      divergenceHtml = `<p style="font-size:0.78rem;color:var(--neutral);margin-top:0.6rem">⚠ Dispersão alta entre componentes (${minV.toFixed(0)} a ${maxV.toFixed(0)}) — só ${aligned}/${components.length} concordam com o agregado. O número consolidado pode estar escondendo sinais contraditórios.</p>`
    } else if (aligned === components.length) {
      divergenceHtml = `<p style="font-size:0.78rem;color:var(--text-faint);margin-top:0.6rem">Sinais alinhados: ${aligned}/${components.length} componentes concordam com o agregado.</p>`
    }
  }

  const aggregateItem = `
    <div class="fg-detail-row fg-detail-aggregate">
      <div class="fg-detail-name">Agregado</div>
      <div style="text-align:right">
        <div class="fg-detail-value">${Number(latest.index_value).toFixed(0)}</div>
        <div class="fg-detail-label" style="color:${fgLabelColor(latest.label)}">${latest.label}</div>
      </div>
    </div>
  `

  const componentItems = components
    .map(
      (c) => `
    <div class="fg-detail-row">
      <div>
        <div class="fg-detail-name">${FG_COMPONENT_LABELS[c.component] || c.component}</div>
        <div class="fg-detail-desc">${FG_COMPONENT_DESC[c.component] || ''}</div>
      </div>
      <div style="text-align:right">
        <div class="fg-detail-value">${Number(c.value).toFixed(0)}</div>
        <div class="fg-detail-label" style="color:${fgLabelColor(c.label)}">${c.label || ''}</div>
      </div>
    </div>
  `
    )
    .join('')

  el.innerHTML = `
    <div class="fg-detail-grid">${aggregateItem}${componentItems}</div>
    ${chartHtml}
    ${divergenceHtml}
    <p class="muted" style="font-size:0.72rem;margin-top:0.75rem">Índice agregado (0-100): 0 = medo extremo, 100 = ganância extrema. Cada sub-indicador entra com peso igual pra formar o número final.${notEnoughNote ? ' ' + notEnoughNote : ''}</p>
  `
}

async function renderTrackRecord() {
  const { data, error } = await sb
    .from('prediction_resolutions')
    .select(
      'direction_correct, direction_actual, actual_return_pct, predictions(confidence_pct, horizon, target_date, instrument_id, magnitude_min_pct, magnitude_max_pct, direction, instruments(asset_class))'
    )
  const el = document.getElementById('track-record')
  const summaryEl = document.getElementById('track-record-summary')
  if (error || !data || data.length === 0) {
    el.innerHTML = `<p class="muted">Ainda sem histórico de acurácia — o primeiro resultado aparece assim que os palpites de hoje forem resolvidos, comparando com o fechamento do dia seguinte.</p>`
    if (summaryEl) summaryEl.innerHTML = `<p class="muted" style="font-size:0.8rem">Track record: ainda sem histórico.</p>`
    return
  }
  const total = data.length
  const acertos = data.filter((r) => r.direction_correct).length
  const pct = ((acertos / total) * 100).toFixed(0)
  const lateralCount = data.filter((r) => r.direction_actual === 'lateral').length
  const baselinePct = ((lateralCount / total) * 100).toFixed(0)

  // Rollup dos últimos 7 dias — o acumulado desde o início pode
  // esconder uma piora/melhora recente. Usa target_date (data que o
  // palpite valia), não a data em que foi resolvido.
  const sevenDaysAgo = new Date()
  sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7)
  const sevenDaysAgoStr = sevenDaysAgo.toISOString().slice(0, 10)
  const last7 = data.filter((r) => r.predictions?.target_date && r.predictions.target_date >= sevenDaysAgoStr)
  const last7Acertos = last7.filter((r) => r.direction_correct).length
  const last7Errados = last7.length - last7Acertos
  const rollupHtml =
    last7.length > 0
      ? `
    <div class="track-horizon-row" style="margin-top:0.4rem">
      <span class="muted">últimos 7 dias:</span>
      <span style="color:var(--risk-on-strong)">✅ ${last7Acertos}</span>
      <span style="color:var(--risk-off-strong)">❌ ${last7Errados}</span>
      <span class="muted">(${((last7Acertos / last7.length) * 100).toFixed(0)}%)</span>
    </div>
  `
      : ''

  // Quebra por horizonte — o agregado pode esconder diferenças reais
  // (ex: 1D costuma acertar mais que 1M, que tem muito mais tempo pra
  // dar errado).
  const byHorizon = ['1D', '1W', '1M']
    .map((h) => {
      const rows = data.filter((r) => r.predictions?.horizon === h)
      if (rows.length === 0) return null
      const hAcertos = rows.filter((r) => r.direction_correct).length
      return { h, pct: ((hAcertos / rows.length) * 100).toFixed(0), acertos: hAcertos, total: rows.length }
    })
    .filter(Boolean)

  const byHorizonHtml =
    byHorizon.length > 0
      ? `
    <div class="track-horizon-row">
      ${byHorizon.map((x) => `<span><strong>${HORIZON_LETTER[x.h]}</strong> ${x.pct}% <span class="muted">(${x.acertos}/${x.total})</span></span>`).join('')}
    </div>
  `
      : ''

  // Gap de calibração: convicção média declarada vs. acerto real. Se a
  // convicção média bate perto do acerto real, o sistema está calibrado
  // (sabe quando está incerto). Se a convicção é sempre alta mas o
  // acerto não acompanha, é excesso de confiança.
  const withConf = data.filter((r) => r.predictions?.confidence_pct != null)
  const avgConf =
    withConf.length > 0 ? withConf.reduce((s, r) => s + Number(r.predictions.confidence_pct), 0) / withConf.length : null
  const correctConf = withConf.filter((r) => r.direction_correct)
  const wrongConf = withConf.filter((r) => !r.direction_correct)
  const avgConfCorrect =
    correctConf.length > 0 ? correctConf.reduce((s, r) => s + Number(r.predictions.confidence_pct), 0) / correctConf.length : null
  const avgConfWrong =
    wrongConf.length > 0 ? wrongConf.reduce((s, r) => s + Number(r.predictions.confidence_pct), 0) / wrongConf.length : null

  const calibrationHtml =
    avgConf != null
      ? `
    <p class="muted" style="margin-top:0.5rem">Convicção média declarada: ${avgConf.toFixed(0)}% · gap vs. acerto real: ${(avgConf - Number(pct)).toFixed(0)}pp</p>
    ${avgConfCorrect != null && avgConfWrong != null ? `<p class="muted" style="margin-top:0.2rem">Convicção quando acertou: ${avgConfCorrect.toFixed(0)}% · quando errou: ${avgConfWrong.toFixed(0)}%</p>` : ''}
  `
      : ''

  // Item 3: acerto por classe de ativo — o agregado esconde se o
  // sistema é bom em índice e ruim em cripto, por exemplo.
  const byClass = {}
  for (const r of data) {
    const cls = r.predictions?.instruments?.asset_class
    if (!cls) continue
    if (!byClass[cls]) byClass[cls] = { correct: 0, total: 0 }
    byClass[cls].total++
    if (r.direction_correct) byClass[cls].correct++
  }
  const byClassHtml =
    Object.keys(byClass).length > 0
      ? `
    <div style="margin-top:0.6rem">
      <p class="muted" style="margin-bottom:0.3rem">Acerto por classe:</p>
      <div class="track-horizon-row" style="margin-top:0;padding-top:0;border-top:none;flex-wrap:wrap">
        ${Object.entries(byClass)
          .sort((a, b) => b[1].total - a[1].total)
          .map(([cls, v]) => `<span>${ASSET_CLASS_LABELS[cls] || cls} <strong>${((v.correct / v.total) * 100).toFixed(0)}%</strong> <span class="muted">(${v.correct}/${v.total})</span></span>`)
          .join('')}
      </div>
    </div>
  `
      : ''

  // Item 4: acerto de magnitude (faixa), separado de direção — bater a
  // direção com +0,03% numa previsão de +3% a +5% não devia contar
  // como "faixa" batida.
  const withMag = data.filter((r) => r.actual_return_pct != null && r.predictions?.magnitude_min_pct != null && r.predictions?.magnitude_max_pct != null)
  let faixaCorreta = 0
  let erroMagnitudeSoma = 0
  let erroMagnitudeCount = 0
  for (const r of withMag) {
    const absRet = Math.abs(Number(r.actual_return_pct))
    const absMin = Math.min(Math.abs(r.predictions.magnitude_min_pct), Math.abs(r.predictions.magnitude_max_pct))
    const absMax = Math.max(Math.abs(r.predictions.magnitude_min_pct), Math.abs(r.predictions.magnitude_max_pct))
    const ok = r.direction_correct && (r.predictions.direction === 'lateral' ? absRet <= absMax : absRet >= absMin && absRet <= absMax)
    if (ok) faixaCorreta++
    else {
      const erro = absRet < absMin ? absMin - absRet : absRet - absMax
      erroMagnitudeSoma += erro
      erroMagnitudeCount++
    }
  }
  const faixaHtml =
    withMag.length > 0
      ? `<p class="muted" style="margin-top:0.5rem">Acerto de direção: <strong style="color:var(--text)">${pct}%</strong> · Acerto de faixa: <strong style="color:var(--text)">${((faixaCorreta / withMag.length) * 100).toFixed(0)}%</strong> (${faixaCorreta}/${withMag.length})${erroMagnitudeCount > 0 ? ` · erro médio quando fora da faixa: ${(erroMagnitudeSoma / erroMagnitudeCount).toFixed(1)}pp` : ''}</p>`
      : ''

  // Item 5: calibração por faixa de convicção, quebrado por horizonte —
  // D acumula rápido, S e M levam semanas/meses pra ter amostra real.
  // Mostra sempre, mas avisa quando a amostra ainda é pequena.
  const CONF_BUCKETS = [
    [40, 50],
    [50, 60],
    [60, 70],
    [70, 101],
  ]
  const calibByHorizonHtml = ['1D', '1W', '1M']
    .map((h) => {
      const rows = data.filter((r) => r.predictions?.horizon === h && r.predictions?.confidence_pct != null)
      if (rows.length === 0) return null
      const buckets = CONF_BUCKETS.map(([lo, hi]) => {
        const inBucket = rows.filter((r) => Number(r.predictions.confidence_pct) >= lo && Number(r.predictions.confidence_pct) < hi)
        if (inBucket.length === 0) return null
        const bAcertos = inBucket.filter((r) => r.direction_correct).length
        return { lo, hi: hi === 101 ? '+' : hi, pct: ((bAcertos / inBucket.length) * 100).toFixed(0), n: inBucket.length }
      }).filter(Boolean)
      if (buckets.length === 0) return null
      return `
        <div style="margin-top:0.3rem">
          <span class="muted" style="font-size:0.78rem">${HORIZON_LETTER[h]}:</span>
          ${buckets.map((b) => `<span style="font-size:0.78rem;margin-left:0.6rem">${b.lo}-${b.hi === '+' ? '100' : b.hi}%${b.hi === '+' ? '+' : ''} → <strong>${b.pct}%</strong> <span class="muted">(n=${b.n}${b.n < 20 ? ', amostra pequena' : ''})</span></span>`).join('')}
        </div>
      `
    })
    .filter(Boolean)
    .join('')
  const calibByHorizonSection =
    calibByHorizonHtml.length > 0
      ? `
    <div style="margin-top:0.6rem">
      <p class="muted" style="margin-bottom:0.2rem">Calibração por convicção declarada (acerto real por faixa):</p>
      ${calibByHorizonHtml}
      <p class="muted" style="font-size:0.72rem;margin-top:0.3rem">D acumula rápido (resolve todo dia); S leva semanas e M leva meses pra ter amostra confiável — trate os números de S/M com cautela até n≥20.</p>
    </div>
  `
      : ''

  // Item 6: baseline "momentum simples" — e se a gente só chutasse que
  // a direção anterior se repete? SÓ pra 1D — em 1W/1M, 2 previsões
  // consecutivas (por target_date) podem ter sido EMITIDAS antes do
  // resultado uma da outra ficar conhecido (o alvo de 7/30 dias atrás
  // ainda não tinha vencido quando a previsão seguinte foi feita) —
  // isso inflaria o baseline de forma artificial (look-ahead).
  const byInstHorizon = {}
  for (const r of data) {
    if (r.predictions?.horizon !== '1D') continue
    if (!r.predictions?.instrument_id || !r.predictions?.target_date) continue
    const key = r.predictions.instrument_id
    if (!byInstHorizon[key]) byInstHorizon[key] = []
    byInstHorizon[key].push(r)
  }
  let momentumCorrect = 0
  let momentumTotal = 0
  for (const key in byInstHorizon) {
    const rows = byInstHorizon[key].sort((a, b) => a.predictions.target_date.localeCompare(b.predictions.target_date))
    for (let i = 1; i < rows.length; i++) {
      if (rows[i].direction_actual == null || rows[i - 1].direction_actual == null) continue
      momentumTotal++
      if (rows[i].direction_actual === rows[i - 1].direction_actual) momentumCorrect++
    }
  }
  const momentumHtml =
    momentumTotal > 0
      ? `<p class="muted" style="margin-top:0.3rem">Baseline "momentum simples" — só 1D (repete a direção do dia anterior do mesmo ativo): ${((momentumCorrect / momentumTotal) * 100).toFixed(0)}% (n=${momentumTotal})</p>`
      : ''

  // Resumo compacto pro topo da aba — o mesmo dado, só resumido numa
  // linha, pra quem entra na aba querendo ver "o que ele está
  // prevendo agora" e não o histórico completo primeiro.
  if (summaryEl) {
    const horizonSummary = byHorizon.map((x) => `${HORIZON_LETTER[x.h]} ${x.pct}%`).join(' · ')
    summaryEl.innerHTML = `<p style="font-size:0.85rem;margin:0"><strong>Track record:</strong> ${pct}% geral${horizonSummary ? ` · ${horizonSummary}` : ''} · n=${total} <span class="muted">— detalhe completo no final da página</span></p>`
  }

  el.innerHTML = `
    <div class="stat-big">${pct}%</div>
    <p class="muted">${acertos} de ${total} palpites resolvidos, acerto de direção</p>
    ${byHorizonHtml}
    ${rollupHtml}
    ${faixaHtml}
    ${byClassHtml}
    <p class="muted" style="margin-top:0.5rem">Baseline "sempre lateral": ${baselinePct}%</p>
    ${momentumHtml}
    ${calibrationHtml}
    ${calibByHorizonSection}
    <details class="pred-details" style="margin-top:0.75rem">
      <summary>o que cada número significa</summary>
      <p><strong>${pct}%:</strong> de todos os palpites já resolvidos (todos os ativos e horizontes juntos), quantos acertaram a direção (alta/baixa/lateral). É o sistema inteiro, não um ativo específico.</p>
      <p><strong>Acerto de faixa:</strong> além de acertar a direção, o movimento real caiu dentro da magnitude prevista (ex: previu +2% a +4% e o real foi +3%)? Bater a direção sozinha é mais fácil que bater a faixa também.</p>
      <p><strong>Acerto por classe:</strong> quebra o acerto de direção por tipo de ativo — o sistema pode ser bom em índices e ruim em cripto, por exemplo, e o número agregado esconde isso.</p>
      <p><strong>Baseline "sempre lateral":</strong> se o sistema chutasse "lateral" pra tudo, sem inteligência nenhuma, acertaria essa % só por acaso. Serve pra saber se a IA está sendo útil de verdade, ou só um pouco melhor que não fazer nada.</p>
      <p><strong>Baseline "momentum simples":</strong> se o sistema só repetisse a última direção observada do mesmo ativo, sem nenhuma análise nova, acertaria essa %. Outra régua pra saber se a IA está agregando valor de verdade.</p>
      <p><strong>Convicção média declarada vs. gap:</strong> quanto a IA diz confiar, em média, comparado com o quanto ela realmente acerta. Gap negativo = mais modesta do que deveria (sub-confiante); gap positivo = mais confiante do que deveria (excesso de confiança).</p>
      <p><strong>Convicção quando acertou vs. errou:</strong> se a convicção é mais alta nos acertos que nos erros, é sinal de boa calibração — a IA "sabe" quando está mais segura, mesmo que a taxa de acerto geral ainda seja baixa.</p>
      <p><strong>Calibração por faixa de convicção:</strong> quando a IA diz estar 70%+ confiante, ela realmente acerta mais que quando diz 40-49%? Se sim, a convicção declarada é informação útil. Se não, ela não significa nada — e isso é importante saber.</p>
    </details>
  `
}

// A resolução pode vir como objeto solto ou lista, dependendo de como o
// Supabase detecta a relação (é 1-pra-1, então pode variar) — trata os
// dois formatos pra não depender de qual exatamente ele devolve.
function getResFromPrediction(p) {
  const r = p.prediction_resolutions
  if (!r) return null
  return Array.isArray(r) ? r[0] ?? null : r
}

// Desenha 1 linha de horizonte (D/S/M) com status ✅❌/progresso — usada
// tanto em Rastreabilidade (Histórico) quanto no "rastreabilidade"
// expansível de cada ativo em Palpites (Hoje), pra não duplicar lógica.
function renderHorizonTraceRow(p, marketDate, latestBySymbol) {
  if (!p) return ''
  const res = getResFromPrediction(p)

  if (res) {
    const ret = res.actual_return_pct != null ? `${Number(res.actual_return_pct) > 0 ? '+' : ''}${Number(res.actual_return_pct).toFixed(2)}%` : ''
    // Faixa julgada separado da direção — bater a direção com pouca
    // magnitude (ex: +0,03% numa previsão de +3% a +5%) não devia
    // contar como "faixa" batida, só como "direção" batida.
    let faixaHtml = ''
    if (res.actual_return_pct != null && p.magnitude_min_pct != null && p.magnitude_max_pct != null) {
      const absRet = Math.abs(Number(res.actual_return_pct))
      const absMin = Math.min(Math.abs(p.magnitude_min_pct), Math.abs(p.magnitude_max_pct))
      const absMax = Math.max(Math.abs(p.magnitude_min_pct), Math.abs(p.magnitude_max_pct))
      const faixaOk = res.direction_correct && (p.direction === 'lateral' ? absRet <= absMax : absRet >= absMin && absRet <= absMax)
      faixaHtml = `<span class="${faixaOk ? 'ok' : 'off'}">Faixa ${faixaOk ? '✅' : '❌'}</span>`
    }
    return `
      <div class="trace-h-block">
        <div class="trace-h-mini">
          <span class="${res.direction_correct ? 'ok' : 'off'}">Direção ${res.direction_correct ? '✅' : '❌'}</span>
          ${faixaHtml}
          <span class="muted">real: ${ret}</span>
        </div>
        <div class="trace-h-line muted">${fmtPrice(p.reference_price)} → ${fmtPrice(res.actual_close)}</div>
      </div>
    `
  }

  // Prazo já venceu mas o pipeline ainda não julgou oficialmente — não
  // finge que está "acompanhando", isso é falha/atraso de resolução,
  // não tracking normal.
  const today = todayBRTClient()
  if (p.target_date && p.target_date < today) {
    return `
      <div class="trace-h-block">
        <span class="trace-h-status pending">resolução pendente</span>
        <div class="trace-h-line muted">prazo (${fmtDate(p.target_date)}) já passou, aguardando o pipeline resolver</div>
      </div>
    `
  }

  // Ainda não julgado — mesma lógica de progresso que "Semana/Mês em
  // Andamento" já usava, comparando com o preço atual.
  const latestData = latestBySymbol?.[p.instruments?.symbol_internal]
  const current = latestData?.close
  // Se o dado mais recente não é mais novo que o dia em que o palpite foi
  // emitido, ainda não houve fechamento novo pra medir nada — não dá pra
  // julgar "acertando/errando" comparando o preço com ele mesmo.
  const hasNewerData = latestData?.market_date && latestData.market_date > marketDate

  let detailLine = `<div class="trace-h-line muted">sem dado atual pra medir progresso</div>`
  let progressBar = ''
  let miniHtml = `<span class="trace-h-status pending">não julgado</span>`

  if (!hasNewerData) {
    miniHtml = `<span class="trace-h-status pending">aguardando fechamento</span>`
    detailLine = `<div class="trace-h-line muted">ainda sem fechamento novo desde ${fmtDate(marketDate)} · estava: ${fmtPrice(p.reference_price)}</div>`
  } else if (current != null && p.reference_price != null) {
    const actualPct = ((current - p.reference_price) / p.reference_price) * 100
    const absActual = Math.abs(actualPct)
    const hasMag = p.magnitude_min_pct != null && p.magnitude_max_pct != null
    const absMin = hasMag ? Math.min(Math.abs(p.magnitude_min_pct), Math.abs(p.magnitude_max_pct)) : null
    const absMax = hasMag ? Math.max(Math.abs(p.magnitude_min_pct), Math.abs(p.magnitude_max_pct)) : null
    const dirOk = p.direction === 'lateral' ? absActual <= (absMax ?? Infinity) : p.direction === 'alta' ? actualPct > 0 : actualPct < 0

    // Faixa em progresso (ainda não resolvido): abaixo do alvo ainda,
    // dentro da faixa, ou já além dela — só faz sentido pra alta/baixa,
    // pra lateral a própria direção já cobre isso.
    let faixaHtml = ''
    if (hasMag && p.direction !== 'lateral') {
      if (!dirOk) faixaHtml = `<span class="off">Faixa ❌</span>`
      else if (absActual < absMin) faixaHtml = `<span class="pending">Faixa ⏳</span>`
      else if (absActual <= absMax) faixaHtml = `<span class="ok">Faixa ✅</span>`
      else faixaHtml = `<span class="pending">Faixa ⚠</span>`
    }

    const progressPct = absMax ? Math.min(100, (absActual / absMax) * 100) : null
    const barClass = p.direction === 'lateral' ? 'misto' : p.direction === 'alta' ? 'positivo' : 'negativo'

    miniHtml = `<span class="${dirOk ? 'ok' : 'off'}">Direção ${dirOk ? '✅' : '❌'}</span>${faixaHtml}`
    const sinceLabel = p.horizon === '1D' ? 'hoje' : 'até agora'
    detailLine = `<div class="trace-h-line muted">${sinceLabel}: ${actualPct > 0 ? '+' : ''}${actualPct.toFixed(2)}% · estava: ${fmtPrice(p.reference_price)}</div>`
    progressBar = progressPct != null ? `<div class="driver-bar-track"><div class="driver-bar-fill ${barClass}" style="width:${progressPct}%"></div></div>` : ''
  }

  return `
    <div class="trace-h-block">
      <div class="trace-h-mini">${miniHtml}</div>
      ${detailLine}
      ${progressBar}
    </div>
  `
}

// Preenche o "rastreabilidade" expansível de cada ativo em Palpites
// (aba Hoje) — mesma consulta e mesma renderização por linha que
// Rastreabilidade (Histórico) já usa, só que espalhada nos containers
// de cada bloco de ativo em vez de numa lista única.
async function renderPalpitesRastreabilidade(marketDate, latestBySymbol) {
  const { data } = await sb
    .from('predictions')
    .select(
      'horizon, direction, magnitude_min_pct, magnitude_max_pct, confidence_pct, reference_price, target_date, instruments(symbol_internal), prediction_resolutions(direction_correct, actual_return_pct, actual_close)'
    )
    .in('horizon', ['1D', '1W', '1M'])
    .eq('market_date', marketDate)

  if (!data) return

  const byInstrument = {}
  for (const p of data) {
    const sym = p.instruments?.symbol_internal
    if (!sym) continue
    if (!byInstrument[sym]) byInstrument[sym] = {}
    byInstrument[sym][p.horizon] = p
  }

  for (const [sym, byHorizon] of Object.entries(byInstrument)) {
    for (const h of ['1D', '1W', '1M']) {
      const el = document.getElementById(`rast-${sym}-${h}`)
      if (!el) continue
      el.innerHTML = renderHorizonTraceRow(byHorizon[h], marketDate, latestBySymbol)
    }
  }
}

  asia: '🌏', oriente_medio: '🌍', africa: '🌍', america_latina: '🌎', global: '🌐',

function impactColor(impact) {
  if (impact === 'positivo' || impact === 'risk_on') return 'var(--risk-on-strong)'
  if (impact === 'negativo' || impact === 'risk_off') return 'var(--risk-off-strong)'
  return 'var(--text-faint)'
}
function impactBg(impact) {
  if (impact === 'positivo' || impact === 'risk_on') return 'rgba(63,214,126,0.15)'
  if (impact === 'negativo' || impact === 'risk_off') return 'rgba(240,69,60,0.15)'
  return 'var(--surface-2)'
}
const IMPACT_LABELS = { risk_on: 'Risk-On', risk_off: 'Risk-Off', neutro: 'Neutro', misto: 'Misto', positivo: 'Positivo', negativo: 'Negativo' }

// Notícias (passado) + Radar (futuro), fundidos numa timeline só,
// agrupada por tema — os dois falam da mesma coisa (o que está
// acontecendo lá fora), só em direções de tempo diferentes. Tema
// "macro" já não chega aqui — mora inteiro em Dados.
function importanceColor(imp) {
  if (imp === 'alta') return 'var(--risk-off-strong)'
  if (imp === 'media') return 'var(--neutral)'
  return 'var(--text-faint)'
}
function importanceBg(imp) {
  if (imp === 'alta') return 'rgba(240,69,60,0.15)'
  if (imp === 'media') return 'rgba(232,176,75,0.15)'
  return 'var(--surface-2)'
}

let noticiasRadarRawData = { events: [], radar: [] }

function renderNoticiasRadar(events, radar, kpiHasDataMap) {
  const today = todayBRTClient()
  const items = []

  for (const e of events || []) {
    const matched = e.theme === 'macro' ? newsMatchedChecklistItem(e) : null
    const matchedHasData = matched && kpiHasDataMap ? !!kpiHasDataMap[matched.label + '|' + matched.pais] : false
    const assets = (e.event_instruments || []).map((ei) => ei.instruments?.symbol_internal).filter(Boolean)
    items.push({
      type: 'noticia',
      typeLabel: 'NOTÍCIA',
      tema: e.theme,
      sortKey: e.market_date || '',
      whenHtml: e.market_date ? fmtDate(e.market_date) : '',
      title: e.headline,
      detail: e.summary,
      porQueImporta: e.por_que_importa,
      newsImportance: e.importance,
      assets,
      tag: e.impact_direction,
      tagColor: impactColor(e.impact_direction),
      tagBg: impactBg(e.impact_direction),
      source: e.source_name,
      matchedLabel: matched ? matched.label : null,
      matchedHasData,
    })
  }
  for (const r of radar || []) {
    // Não fecha ciclo (isso é trabalho do Palpites/Rastreabilidade, não
    // do Radar) — mas continua visível, só marcado (e esmaecido), pra
    // dar pra monitorar enquanto o sistema é novo.
    const expired = r.expected_date && r.expected_date < today
    const whenHtml =
      `${fmtDate(r.market_date)}` +
      (r.expected_date
        ? ` · <span style="color:var(--neutral)">${fmtDate(r.expected_date)}${r.expected_time ? ' · ' + escapeHtml(r.expected_time) : ''}</span>`
        : ' · <span style="color:var(--neutral)">data do evento incerta</span>')
    items.push({
      type: 'radar',
      typeLabel: 'RADAR',
      expired,
      tema: r.theme,
      sortKey: r.market_date || '',
      whenHtml,
      title: r.description,
      detail: r.impact_note,
      tag: r.importance,
      tagColor: importanceColor(r.importance),
      tagBg: importanceBg(r.importance),
    })
  }

  if (items.length === 0) return `<p class="muted">Nada registrado ainda.</p>`

  // KPI rápido: 2 fileiras — Notícias (total, risk-on, risk-off, alto
  // impacto) e Radar (total pendente, alta importância) — separados,
  // não misturados numa linha só.
  let totalNoticias = 0
  let riskOn = 0
  let riskOff = 0
  let altoImpactoNoticia = 0
  let totalRadarPendente = 0
  let altaImportanciaRadar = 0
  for (const it of items) {
    if (it.type === 'noticia') {
      totalNoticias++
      if (it.tag === 'risk_on' || it.tag === 'positivo') riskOn++
      if (it.tag === 'risk_off' || it.tag === 'negativo') riskOff++
      if (it.newsImportance === 'alta') altoImpactoNoticia++
    }
    if (it.type === 'radar' && !it.expired) {
      totalRadarPendente++
      if (it.tag === 'alta') altaImportanciaRadar++
    }
  }
  const kpiHtml = `
    <div style="background:var(--surface-2);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.5rem;">
      <div style="display:flex;gap:1rem;flex-wrap:wrap;">
        <div style="flex:1;text-align:center;min-width:80px;">
          <div style="font-family:var(--font-mono);font-size:1.4rem;font-weight:700;color:var(--text)">${totalNoticias}</div>
          <div class="muted" style="font-size:0.7rem">notícias</div>
        </div>
        <div style="flex:1;text-align:center;min-width:80px;">
          <div style="font-family:var(--font-mono);font-size:1.4rem;font-weight:700;color:var(--risk-on-strong)">${riskOn}</div>
          <div class="muted" style="font-size:0.7rem">risk-on</div>
        </div>
        <div style="flex:1;text-align:center;min-width:80px;">
          <div style="font-family:var(--font-mono);font-size:1.4rem;font-weight:700;color:var(--risk-off-strong)">${riskOff}</div>
          <div class="muted" style="font-size:0.7rem">risk-off</div>
        </div>
        <div style="flex:1;text-align:center;min-width:80px;">
          <div style="font-family:var(--font-mono);font-size:1.4rem;font-weight:700;color:var(--risk-off-strong)">${altoImpactoNoticia}</div>
          <div class="muted" style="font-size:0.7rem">alto impacto</div>
        </div>
      </div>
      <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:0.75rem;padding-top:0.75rem;border-top:1px dashed var(--border);">
        <div style="flex:1;text-align:center;min-width:80px;">
          <div style="font-family:var(--font-mono);font-size:1.4rem;font-weight:700;color:var(--neutral)">${totalRadarPendente}</div>
          <div class="muted" style="font-size:0.7rem">no radar</div>
        </div>
        <div style="flex:1;text-align:center;min-width:80px;">
          <div style="font-family:var(--font-mono);font-size:1.4rem;font-weight:700;color:var(--risk-off-strong)">${altaImportanciaRadar}</div>
          <div class="muted" style="font-size:0.7rem">alta importância</div>
        </div>
      </div>
    </div>
  `

  // Sem subdivisão por tema — 1 lista só, mais recente publicada
  // primeiro, com uma flag mostrando o tema em vez de agrupar.
  items.sort((a, b) => (b.sortKey || '').localeCompare(a.sortKey || ''))

  return kpiHtml + items.map(renderNoticiaRadarItem).join('')
}

function renderNoticiaRadarItem(it) {
  // B: tipo+tema fundidos num badge só, em vez de 2 separados.
  const typeTemaClass = it.type === 'radar' ? 'type-radar' : 'type-noticia'
  const typeTemaLabel = `${it.typeLabel} · ${THEME_LABELS[it.tema] || it.tema || ''}`

  // C: ordem fixa — tipo+tema, depois status (vencida/KPI), depois
  // importância/sentimento por último.
  const statusBadge =
    it.type === 'radar'
      ? it.expired
        ? `<span class="type-badge type-vencida" title="Data já passou, sem confirmação de resultado ainda">VENCIDA</span>`
        : ''
      : it.matchedLabel
      ? `<span class="type-badge" style="color:${it.matchedHasData ? 'var(--risk-on-strong)' : 'var(--risk-off-strong)'};background:${it.matchedHasData ? 'rgba(63,214,126,0.15)' : 'rgba(240,69,60,0.15)'}" title="${it.matchedHasData ? 'KPI já tem dado real confirmado' : 'KPI ainda sem dado real confirmado'}">KPI · ${escapeHtml(it.matchedLabel)}</span>`
      : ''

  // D: item vencido fica com o card inteiro esmaecido, não só o selo.
  const assetsHtml =
    it.assets && it.assets.length > 0
      ? `<div style="margin-top:0.3rem">${it.assets.map((a) => `<span class="tag" style="background:var(--surface-2);color:var(--text-muted)">${escapeHtml(a)}</span>`).join('')}</div>`
      : ''

  return `
    <div class="item" style="${it.expired ? 'opacity:0.55;' : ''}">
      <span class="type-badge ${typeTemaClass}">${typeTemaLabel}</span>
      ${statusBadge}
      ${it.newsImportance ? `<span class="tag" style="color:${importanceColor(it.newsImportance)};background:${importanceBg(it.newsImportance)}">${escapeHtml(it.newsImportance)}</span>` : ''}
      ${it.tag ? `<span class="tag" style="${it.tagColor ? `color:${it.tagColor};background:${it.tagBg || ''}` : ''}">${escapeHtml(IMPACT_LABELS[it.tag] || it.tag)}</span>` : ''}
      <span class="when">${it.whenHtml}</span>
      <p class="headline">${escapeHtml(it.title)}</p>
      ${it.detail ? `<p class="summary">${escapeHtml(it.detail)}</p>` : ''}
      ${assetsHtml}
      ${it.porQueImporta ? `<details class="pred-details" style="margin-top:0.3rem"><summary>por que importa</summary><p>${escapeHtml(it.porQueImporta)}</p></details>` : ''}
      ${it.source ? `<p class="muted" style="font-size:0.68rem;margin-top:0.2rem">Fonte: ${escapeHtml(it.source)}</p>` : ''}
    </div>
  `
}

// A: busca dado de Macro só pra saber se cada KPI citado já tem

// casamento já usada dentro da aba Macro.
async function updateNoticiasRadarKpi() {
  const el = document.getElementById('noticias-radar-list')
  if (!el) return

  const { data: macro } = await sb
    .from('macro_dados')
    .select('indicator_name,pais,release_date')
    .order('release_date', { ascending: false, nullsFirst: false })
    .limit(50)

  const kpiHasDataMap = {}
  for (const ci of MACRO_CHECKLIST) {
    const hasMatch = (macro || []).some(

// Tendência por tema — cresce sozinho conforme os dias passam, sem
// precisar mexer em código de novo. Agrupa por "tema" (agora travado
// numa lista fechada, então dá pra comparar entre dias com confiança).
async function renderThemeTrends(driversToday) {
  const el = document.getElementById('theme-trends')
  if (!el) return

  const { data } = await sb.from('drivers').select('market_date, tema, forca, direcao').order('market_date', { ascending: false }).limit(800)

  // Agrupa histórico: tema -> dia -> [forças ASSINADAS], pra tendência
  // capturar direção, não só magnitude — um tema que vira de +8 pra -8
  // não pode aparecer como "força 8, estável".
  const byTema = {}
  for (const d of data || []) {
    if (!d.tema) continue
    if (!byTema[d.tema]) byTema[d.tema] = {}
    if (!byTema[d.tema][d.market_date]) byTema[d.tema][d.market_date] = []
    const signed = d.direcao === 'negativo' ? -Number(d.forca) : Number(d.forca)
    byTema[d.tema][d.market_date].push(signed)
  }

  // Agrupa os drivers de HOJE por tema — pode ter 0, 1 ou mais no mesmo tema
  const todayByTema = {}
  for (const d of driversToday || []) {
    if (!d.tema) continue
    if (!todayByTema[d.tema]) todayByTema[d.tema] = []
    todayByTema[d.tema].push(d)
  }

  const allTemas = new Set([...Object.keys(byTema), ...Object.keys(todayByTema)])

  if (allTemas.size === 0) {
    el.innerHTML = `<p class="muted">Drivers &amp; tendências ainda não gerados hoje.</p>`
    return
  }

  // Ordena: temas com driver hoje primeiro (pela força máxima de hoje),
  // temas só-histórico (sem nada hoje) depois.
  const temaOrder = [...allTemas].sort((a, b) => {
    const aToday = todayByTema[a] ? Math.max(...todayByTema[a].map((d) => Number(d.forca))) : -1
    const bToday = todayByTema[b] ? Math.max(...todayByTema[b].map((d) => Number(d.forca))) : -1
    return bToday - aToday
  })

  const cards = temaOrder
    .map((tema) => {
      const todayDrivers = todayByTema[tema] || []
      const todayHtml =
        todayDrivers.length > 0
          ? todayDrivers
              .map(
                (d) => `
        <div class="theme-today-driver">
          <div class="driver-top">
            <span class="driver-nome">${escapeHtml(d.nome)}</span>
            <span class="driver-tendencia" style="color:${TENDENCIA_COLOR[d.tendencia] || 'var(--text-faint)'}">${TENDENCIA_LABELS[d.tendencia] || d.tendencia}</span>
          </div>
          <div class="driver-bar-track"><div class="driver-bar-fill ${d.direcao}" style="width:${Number(d.forca) * 10}%"></div></div>
          <p class="driver-next">${escapeHtml(d.proximo_passo)}</p>
        </div>
      `
              )
              .join('')
          : `<p class="muted" style="font-size:0.72rem">Nenhum driver específico hoje.</p>`

      const byDay = byTema[tema] || {}
      const days = Object.keys(byDay).sort()
      const series = days.map((day) => ({
        day,
        avg: byDay[day].reduce((s, v) => s + v, 0) / byDay[day].length,
      }))

      let trendHtml
      if (series.length < 3) {
        trendHtml = `<p class="muted" style="font-size:0.68rem">Tendência aparece com mais dias (hoje: ${series.length}).</p>`
      } else {
        const bars = series
          .map((s) => {
            const magPct = Math.min(100, (Math.abs(s.avg) / 10) * 100)
            const isPos = s.avg >= 0
            const color = isPos ? 'var(--risk-on-strong)' : 'var(--risk-off-strong)'
            return `
              <div style="flex:1;display:flex;flex-direction:column;height:100%;" title="${fmtShortDate(s.day)}: ${s.avg > 0 ? '+' : ''}${s.avg.toFixed(1)}">
                <div style="flex:1;display:flex;align-items:flex-end;justify-content:center;">
                  ${isPos ? `<div style="width:60%;height:${magPct}%;background:${color};border-radius:2px 2px 0 0;"></div>` : ''}
                </div>
                <div style="flex:1;display:flex;align-items:flex-start;justify-content:center;">
                  ${!isPos ? `<div style="width:60%;height:${magPct}%;background:${color};border-radius:0 0 2px 2px;"></div>` : ''}
                </div>
              </div>
            `
          })
          .join('')
        const latest = series[series.length - 1]
        const first = series[0]
        const trendArrow = latest.avg > first.avg + 0.5 ? '↑' : latest.avg < first.avg - 0.5 ? '↓' : '→'
        trendHtml = `
          <div class="muted" style="font-size:0.68rem;margin-bottom:0.2rem">${trendArrow} influência ${latest.avg > 0 ? '+' : ''}${latest.avg.toFixed(1)}/10 (histórico, positivo/negativo)</div>
          <div style="position:relative;height:32px;">
            <div style="position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--border);"></div>
            <div style="display:flex;height:100%;gap:2px;position:relative;">${bars}</div>
          </div>
        `
      }

      return `
        <div class="theme-card">
          <div class="theme-card-title">${DRIVER_THEME_LABELS[tema] || tema}</div>
          ${todayHtml}
          <div style="margin-top:0.5rem;padding-top:0.5rem;border-top:1px dashed var(--border);">
            ${trendHtml}
          </div>
        </div>
      `
    })
    .join('')

  el.innerHTML = `<div class="theme-trends-grid">${cards}</div>`
}

let currentMainTab = 'termometro'

async function loadDashboard(forcedDate) {
  const app = document.getElementById('app')
  try {
    const { data: allDaysData, error: allDaysError } = await sb
      .from('conclusao_operacional')
      .select('market_date')
      .order('market_date', { ascending: false })
      .limit(30)

    if (allDaysError) {
      app.innerHTML = `<div class="error">ERRO DE CONSULTA — não deu pra confirmar se existe dado ou não. Detalhe: ${escapeHtml(allDaysError.message)}</div>`
      return
    }

    // Item 9: a data "principal" vinha só de conclusao_operacional — se
    // a execução de hoje falhar ANTES de criar essa linha, o sistema
    // mostraria o dia anterior como se fosse normal, sem avisar que
    // hoje falhou. Busca a execução mais recente separadamente pra
    // detectar esse caso.
    const { data: latestRunData, error: latestRunError } = await sb.from('analysis_runs').select('market_date, status, notes').order('market_date', { ascending: false }).limit(1).maybeSingle()
    if (latestRunError) console.error('Falha ao buscar analysis_runs mais recente:', latestRunError.message)

    const availableDays = (allDaysData || []).map((d) => d.market_date)
    const marketDate = forcedDate || availableDays[0]
    selectedMarketDate = marketDate

    if (!marketDate) {
      app.innerHTML = `<div class="error">Nenhum dia completo ainda. O pipeline roda todo dia útil às 22h BRT — volte depois da primeira execução completa.</div>`
      return
    }

    // Dia anterior disponível (não necessariamente "ontem" no calendário
    // — pula fim de semana/feriado) — usado só pra comparar convicção.
    const marketDateIdx = availableDays.indexOf(marketDate)
    const previousMarketDate = marketDateIdx >= 0 && marketDateIdx + 1 < availableDays.length ? availableDays[marketDateIdx + 1] : null

    const [marketDataRes, regimeRes, regimeOntemRes, concRes, predsRes, predsOntemRes, eventsRes, radarRes, cenariosRes, cenariosOntemRes, veredictoRes, fluxoRes, driversRes, runStatusRes, accuracyRes, regimeThresholdsRes] = await Promise.all([
      sb.from('market_data').select('close,change_pct,market_date,instruments(symbol_internal)').order('market_date', { ascending: false }),
      sb.from('regime_diario').select('*').eq('market_date', marketDate),
      previousMarketDate
        ? sb.from('regime_diario').select('mercado,global_score').eq('market_date', previousMarketDate)
        : Promise.resolve({ data: [] }),
      sb.from('conclusao_operacional').select('texto,driver_do_dia,drivers_ainda_ativos,narrativa_dominante,sinais_alerta,o_que_mercado_precisa,correlacao_do_dia,regime_condicional,divergencia_sinais,confirmacao_cross_asset,narrativa_semana,narrativa_mes').eq('market_date', marketDate).maybeSingle(),
      sb.from('predictions').select('*,instruments(symbol_internal,name,asset_class)').eq('market_date', marketDate).order('confidence_pct', { ascending: false }),
      previousMarketDate
        ? sb.from('predictions').select('instrument_id,horizon,direction,confidence_pct').eq('market_date', previousMarketDate)
        : Promise.resolve({ data: [] }),
      sb.from('events').select('*, event_instruments(instruments(symbol_internal))').eq('market_date', marketDate),
      sb.from('radar_eventos').select('*').eq('market_date', marketDate).neq('theme', 'macro').order('expected_date', { ascending: true, nullsFirst: false }),
      sb.from('cenarios').select('tipo,condicao,efeito_esperado,probabilidade,favorece,pressiona,invalida_se').eq('market_date', marketDate),
      previousMarketDate
        ? sb.from('cenarios').select('tipo,probabilidade').eq('market_date', previousMarketDate)
        : Promise.resolve({ data: [] }),
      sb.from('veredito_operacional').select('mercado,decisao,razao,invalidation_note').eq('market_date', marketDate),
      sb.from('fluxo_por_classe').select('asset_class,status,motivo').eq('market_date', marketDate),
      sb.from('drivers').select('nome,tema,direcao,forca,tendencia,proximo_passo').eq('market_date', marketDate),
      sb.from('analysis_runs').select('status,notes').eq('market_date', marketDate).maybeSingle(),
      sb.from('prediction_resolutions').select('direction_correct, predictions(instrument_id, horizon)').order('id', { ascending: false }).limit(500),
      sb
        .from('config')
        .select('key,value')
        .in('key', ['regime_threshold_risk_on_forte', 'regime_threshold_risk_on_fraco', 'regime_threshold_risk_off_moderado', 'regime_threshold_risk_off_forte']),
    ])

    // Confiabilidade histórica por ativo (só horizonte 1D — é o que tem
    // mais amostra) — cresce sozinho conforme os dias passam, sem
    // precisar mexer em código de novo.
    const accuracyByInstrument = {}
    for (const r of accuracyRes.data || []) {
      if (r.predictions?.horizon !== '1D') continue
      const iid = r.predictions?.instrument_id
      if (iid == null) continue
      if (!accuracyByInstrument[iid]) accuracyByInstrument[iid] = { correct: 0, total: 0 }
      accuracyByInstrument[iid].total++
      if (r.direction_correct) accuracyByInstrument[iid].correct++
    }

    const latestBySymbol = {}
    for (const row of marketDataRes.data || []) {
      const sym = row.instruments?.symbol_internal
      if (!sym || latestBySymbol[sym]) continue
      latestBySymbol[sym] = row
    }

    const loadedAt = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    const isStale = marketDate !== todayBRTClient()
    // Item 9+10: só assume "hoje está em andamento" quando é isso
    // mesmo — se uma execução mais recente que o último relatório
    // válido falhou (ou ficou incompleta), avisa isso explicitamente,
    // em vez de mostrar o dia anterior como se nada tivesse acontecido.
    const newerRunAttempted = latestRunData && latestRunData.market_date > marketDate
    let staleNote = ''
    if (forcedDate) {
      staleNote = `<div class="stale-note">Visualizando ${fmtDate(marketDate)} (dia anterior, escolhido no seletor)</div>`
    } else if (newerRunAttempted && latestRunData.status !== 'success') {
      const statusLabel = latestRunData.status === 'failed' ? 'falhou' : latestRunData.status === 'running' ? 'ainda está em andamento' : 'ficou incompleta'
      staleNote = `<div class="stale-note">⚠ Execução de ${fmtDate(latestRunData.market_date)} ${statusLabel}${latestRunData.notes ? ' — ' + escapeHtml(latestRunData.notes) : ''} — mostrando último relatório válido de ${fmtDate(marketDate)}</div>`
    } else if (isStale) {
      staleNote = `<div class="stale-note">Mostrando o último dia completo: ${fmtDate(marketDate)}</div>`
    }

    const runStatus = runStatusRes.data?.status
    let healthDotClass = 'muted'
    let healthDotTitle = 'Status do pipeline desconhecido'
    let healthLabel = '—'
    let healthBanner = ''
    if (runStatus === 'success') {
      healthDotClass = 'ok'
      healthDotTitle = 'Pipeline completo'
      healthLabel = 'completo'
    } else if (runStatus === 'partial') {
      healthDotClass = 'warn'
      healthDotTitle = 'Pipeline incompleto'
      healthLabel = 'incompleto'
      healthBanner = `<div class="health-banner warn">⚠ Pipeline incompleto — ${escapeHtml(runStatusRes.data?.notes || '')}</div>`
    } else if (runStatus === 'failed') {
      healthDotClass = 'error'
      healthDotTitle = 'Pipeline falhou'
      healthLabel = 'falhou'
      healthBanner = `<div class="health-banner error">✗ Pipeline falhou — ${escapeHtml(runStatusRes.data?.notes || '')}</div>`
    } else if (runStatus === 'running') {
      healthDotClass = 'muted'
      healthDotTitle = 'Pipeline ainda em andamento hoje'
      healthLabel = 'em andamento'
    }

    const daySelectorHtml = availableDays.length > 1
      ? `<select class="day-selector" id="day-selector">
          ${availableDays.map((d) => `<option value="${d}" ${d === marketDate ? 'selected' : ''}>${fmtDate(d)}</option>`).join('')}
        </select>`
      : ''

    app.innerHTML = `
      <header class="top">
        <h1>SISTEMA DE MERCADO</h1>
        <div class="header-right">
          ${daySelectorHtml || `<span class="date">${fmtDate(marketDate)}</span>`}
          <span class="updated-badge"><span class="health-dot ${healthDotClass}" title="${healthDotTitle}"></span>pipeline ${healthLabel} · ${loadedAt}</span>
          <button class="refresh-btn" id="refresh-btn">↻ atualizar</button>
        </div>
      </header>

      ${healthBanner}
      ${staleNote}

      <nav class="tab-nav">
        <button class="tab-btn ${currentMainTab === 'termometro' ? 'active' : ''}" data-tab="termometro" onclick="switchMainTab('termometro')">Termômetro</button>
        <button class="tab-btn ${currentMainTab === 'palpites' ? 'active' : ''}" data-tab="palpites" onclick="switchMainTab('palpites')">Palpites</button>
        <button class="tab-btn ${currentMainTab === 'analise' ? 'active' : ''}" data-tab="analise" onclick="switchMainTab('analise')">Análise</button>
        <button class="tab-btn ${currentMainTab === 'noticias' ? 'active' : ''}" data-tab="noticias" onclick="switchMainTab('noticias')">Notícias &amp; Radar</button>
        <button class="tab-btn ${currentMainTab === 'dados' ? 'active' : ''}" data-tab="dados" onclick="switchMainTab('dados')">Macro</button>
        <button class="tab-btn ${currentMainTab === 'sistema' ? 'active' : ''}" data-tab="sistema" onclick="switchMainTab('sistema')">Sistema</button>
      </nav>

      <div class="tab-panel ${currentMainTab === 'termometro' ? 'active' : ''}" id="tab-termometro">
        ${renderGauge(regimeRes.data, veredictoRes.data, regimeThresholdsRes.data, regimeOntemRes.data)}
        <section>
          <p class="eyebrow">Sentimento EUA</p>
          <div class="card" id="fg-detail"><p class="muted">carregando…</p></div>
        </section>
      </div>

      <div class="tab-panel ${currentMainTab === 'palpites' ? 'active' : ''}" id="tab-palpites">
        ${
          concRes.data?.narrativa_semana || concRes.data?.narrativa_mes
            ? `
        <section style="margin-top:0">
          <div class="card" style="display:flex;gap:1.5rem;flex-wrap:wrap;padding:0.9rem 1.1rem">
            ${concRes.data?.narrativa_semana ? `<div style="flex:1;min-width:240px"><p class="muted" style="font-size:0.7rem;margin-bottom:0.2rem">SEMANA</p><p class="prose-p" style="margin:0;font-size:0.85rem">${highlightPct(concRes.data.narrativa_semana)}</p></div>` : ''}
            ${concRes.data?.narrativa_mes ? `<div style="flex:1;min-width:240px"><p class="muted" style="font-size:0.7rem;margin-bottom:0.2rem">MÊS</p><p class="prose-p" style="margin:0;font-size:0.85rem">${highlightPct(concRes.data.narrativa_mes)}</p></div>` : ''}
          </div>
        </section>
        `
            : ''
        }

        <section ${concRes.data?.narrativa_semana || concRes.data?.narrativa_mes ? '' : 'style="margin-top:0"'}>
          <div class="card" id="track-record-summary" style="padding:0.6rem 1.1rem"><p class="muted" style="font-size:0.8rem">carregando track record…</p></div>
        </section>

        <section>
          <p class="eyebrow">Palpites (${(predsRes.data || []).length})</p>
          <details class="pred-details" style="margin-bottom:0.75rem">
            <summary>o que significa positivo/negativo/neutro (viés por classe)</summary>
            <p><strong>Positivo:</strong> evidência de apetite por risco entrando naquela classe — geralmente preço subindo. Isso é viés de preço, não fluxo real de capital (fundos/ETF) — não estamos coletando esse dado.</p>
            <p><strong>Negativo:</strong> apetite por risco saindo — geralmente preço caindo.</p>
            <p><strong>Neutro:</strong> sem direção clara, dados mistos dentro da classe.</p>
            <p><strong>Atenção com Volatilidade (VIX):</strong> a lógica se inverte — VIX <em>caindo</em> é lido como "negativo" (saída do trade de proteção, sinal calmo/positivo pro mercado), e VIX <em>subindo</em> como "positivo" (entrada em proteção, sinal de medo). Não confunda com "dinheiro saindo do mercado" — é o oposto do que pareceria à primeira vista.</p>
          </details>
          <div class="card" id="predictions-container">${renderPredictions(predsRes.data, latestBySymbol, accuracyByInstrument, fluxoRes.data, predsOntemRes.data)}</div>
        </section>

        <section>
          <p class="eyebrow">Track record — detalhe</p>
          <div class="card" id="track-record"><p class="muted">carregando…</p></div>
        </section>
      </div>

      <div class="tab-panel ${currentMainTab === 'analise' ? 'active' : ''}" id="tab-analise">
        ${renderAnaliseKpi(concRes.data, cenariosRes.data, cenariosOntemRes.data)}

        <section style="margin-top:0">
          <p class="eyebrow">Conclusão operacional</p>
          <div class="card">${renderSynthesis(concRes.data)}</div>
        </section>

        <section>
          <p class="eyebrow">Cenários &amp; Gatilhos</p>
          <div class="card">${renderCenarios(cenariosRes.data)}</div>
        </section>

        <section>
          <p class="eyebrow">Drivers &amp; Tendências</p>
          <div class="card" id="theme-trends"><p class="muted">carregando…</p></div>
        </section>
      </div>

      <div class="tab-panel ${currentMainTab === 'noticias' ? 'active' : ''}" id="tab-noticias">
        <section style="margin-top:0">
          <p class="eyebrow">Notícias &amp; Radar</p>
          <div class="card" id="noticias-radar-list">${renderNoticiasRadar(eventsRes.data, radarRes.data)}</div>
        </section>
      </div>

      <div class="tab-panel ${currentMainTab === 'dados' ? 'active' : ''}" id="tab-dados">
        <section style="margin-top:0">
          <p class="eyebrow">Macro</p>
          <div class="card" id="calendar"><p class="muted">carregando…</p></div>
        </section>
      </div>

      <div class="tab-panel ${currentMainTab === 'sistema' ? 'active' : ''}" id="tab-sistema">
        <section style="margin-top:0">
          <p class="eyebrow">Configurações do sistema</p>
          <div class="card" id="config-panel"><p class="muted">carregando…</p></div>
        </section>
      </div>

      <footer class="foot">dados via Supabase · Sistema de Mercado</footer>
    `

    renderFearGreedDetail()
    renderTrackRecord()
    renderPalpitesRastreabilidade(marketDate, latestBySymbol)
    renderThemeTrends(driversRes.data)
    renderCalendar()
    renderConfig(marketDate)

    noticiasRadarRawData = { events: eventsRes.data || [], radar: radarRes.data || [] }
    updateNoticiasRadarKpi()

    const btn = document.getElementById('refresh-btn')
    if (btn) {
      btn.addEventListener('click', () => {
        btn.disabled = true
        btn.textContent = '↻ atualizando…'
        loadDashboard()
      })
    }

    const daySelect = document.getElementById('day-selector')
    if (daySelect) {
      daySelect.addEventListener('change', (e) => {
        loadDashboard(e.target.value)
      })
    }
  } catch (err) {
    console.error(err)
    app.innerHTML = `<div class="error">Erro ao carregar: ${err.message}</div>`
  }
}

function switchMainTab(tab) {
  currentMainTab = tab
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab))
  document.querySelectorAll('.tab-panel').forEach((p) => p.classList.toggle('active', p.id === 'tab-' + tab))
}

loadDashboard()
</script>
